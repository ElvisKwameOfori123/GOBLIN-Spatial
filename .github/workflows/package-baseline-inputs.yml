name: package-baseline-inputs

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ed-dynamics-foundation
    paths:
      - .github/workflows/package-baseline-inputs.yml
      - scripts/package_baseline_inputs.py
      - data_manifest.yaml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: agent/ed-dynamics-foundation
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependency
        run: pip install PyYAML

      - name: Download and SHA256-verify compact historical inputs
        run: python scripts/package_baseline_inputs.py

      - name: Verify packaged inputs a second time
        run: python scripts/package_baseline_inputs.py --verify-only

      - name: Commit verified baseline bytes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inputs/baseline
          if git diff --cached --quiet; then
            echo "Canonical baseline inputs already packaged; nothing to commit."
            exit 0
          fi
          git commit -m "Package SHA256-verified frozen baseline inputs"
          git push origin HEAD:agent/ed-dynamics-foundation
