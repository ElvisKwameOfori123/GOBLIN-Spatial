name: final-reporting-only

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reporting_only_final.yml"
  workflow_dispatch:

jobs:
  final-reporting-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current reporting code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reporting and query dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[reporting,query]"

      - name: Download validated eight-run publication artifact
        uses: actions/download-artifact@v4
        with:
          name: goblin-spatial-publication-pack
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34288719018

      - name: Augment reporting only
        run: python scripts/augment_final_reporting_pack.py

      - name: Validate final query and map pack
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          manifest = json.loads(Path("reporting/query/reporting_augment_manifest.json").read_text())
          assert manifest["RUN_COUNT"] == 8
          assert manifest["EXPECTED_EDS"] == 2857
          assert manifest["PARQUET_CANONICAL"] is True
          assert manifest["DUCKDB_IS_SCIENTIFIC_AUTHORITY"] is False
          assert manifest["REWETTING_UNMET_IN_ALL_24_RUN_CASES"] is True
          assert set(manifest["VALIDATION"].values()) == {"PASS"}

          catalogue = pd.read_parquet("reporting/query/query_catalogue.parquet")
          tables = set(catalogue["TABLE_NAME"].astype(str))
          required = {
              "report_data__sc1__ed_results",
              "report_data__sc1__national_metrics",
              "report_data__sc1__robust_exposure",
              "report_data__sc2__ed_context",
              "report_data__sc3__ed_results",
              "report_data__sc3__national_summary",
              "report_data__flexibility__allocations",
              "report_data__robustness__rewetting_proxy_sensitivity",
              "map_data__sc1_transition_incidence",
              "map_data__sc3_allocations",
              "figure_data__fig06_sc3_feasibility",
          }
          missing = required - tables
          assert not missing, f"missing DuckDB tables: {sorted(missing)}"

          sc1_map = pd.read_parquet("reporting/map_data/sc1_transition_incidence.parquet")
          assert {"RUN_ID", "SCENARIO_ID", "ALLOCATION_RULE", "CSOED"}.issubset(sc1_map.columns)
          assert len(sc1_map) == 8 * 2857

          rewet = pd.read_parquet("reporting/report_data/robustness/rewetting_proxy_sensitivity.parquet")
          assert len(rewet) == 24
          assert (rewet["UNMET_HA"] > 1e-6).all()
          assert set(rewet["SENSITIVITY_CASE"]) == {"LOW", "CENTRAL", "HIGH"}

          assert Path("reporting/query/goblin_spatial_results.duckdb").exists()
          print(json.dumps(manifest, indent=2))
          print(f"\nDuckDB query tables: {len(catalogue)}")
          print("Final reporting-only validation passed.")
          PY

      - name: Upload final reporting-ready result pack
        uses: actions/upload-artifact@v4
        with:
          name: goblin-spatial-final-reporting-pack
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          path: |
            reporting/report_data/
            reporting/publication/
            reporting/figure_data/
            reporting/map_data/
            reporting/query/
