name: cattle-alias-audit

on:
  pull_request:
    branches: [main]

jobs:
  alias-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geo dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo]"
      - name: Print frozen cattle ED alias audit
        run: python scripts/audit_cattle_ed_alias_crosswalk.py
