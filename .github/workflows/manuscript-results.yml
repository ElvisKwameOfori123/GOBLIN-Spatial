name: final manuscript results and figures

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manuscript-results.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: final-manuscript-results
  cancel-in-progress: true

jobs:
  manuscript-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record workflow run ID
        run: |
          mkdir -p manuscript_outputs
          printf '%s\n' "$GITHUB_RUN_ID" > manuscript_outputs/current_run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript_outputs/current_run.txt
          git commit -m "Record manuscript workflow run ${GITHUB_RUN_ID} [skip ci]" || true
          git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin,scenario]"
          python -m py_compile src/goblin_spatial/manuscript_package.py src/goblin_spatial/manuscript_package_runner.py

      - name: Download frozen validated final-results package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/processed/final_results
          gh run download 33342717108 \
            --repo "${{ github.repository }}" \
            --name GOBLIN-Spatial-final-results \
            --dir data/processed/final_results
          test -f data/processed/final_results/GOBLIN_Spatial_Final_Results.sqlite

      - name: Verify frozen runtime inputs and build baseline for sensitivity runs
        run: |
          goblin-spatial fetch-data --verify-only
          goblin-spatial build --config configs/ireland_2015_2025.yaml

      - name: Run protection-strength sensitivity at lambda 0.25 0.50 0.75
        shell: bash
        run: |
          set -euo pipefail
          scenarios=(SI_SG BE_SG ALL_GAS_NZ)
          rules=(PRORATA DAIRY_PROTECTION ECONOMIC_CAPACITY_PROTECTION SOCIAL_VULNERABILITY_PROTECTION)
          for strength in 0.25 0.50 0.75; do
            tag="${strength/./}"
            root="$PWD/data/processed/protection_sensitivity/lambda_${tag}"
            mkdir -p "$root"
            for scenario in "${scenarios[@]}"; do
              for rule in "${rules[@]}"; do
                out="$root/${scenario}_${rule}"
                echo "Running lambda=${strength}: ${scenario} x ${rule}"
                goblin-spatial-principal "$scenario" \
                  --baseline-year 2020 \
                  --allocation-rule "$rule" \
                  --protection-strength "$strength" \
                  --stage SC1 \
                  --output-dir "$out"
              done
            done
          done

      - name: Summarise pathway versus implementation sensitivity
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from goblin_spatial.scenario.comparison import build_sc1_robust_exposure

          root = Path("data/processed/protection_sensitivity")
          rows = []
          details = []
          for strength, tag in [(0.25, "025"), (0.50, "050"), (0.75, "075")]:
              files = sorted((root / f"lambda_{tag}").glob("*/sc1_ed_results.csv"))
              if len(files) != 12:
                  raise AssertionError(f"lambda={strength}: expected 12 SC1 files, found {len(files)}")
              x = pd.concat([pd.read_csv(p, low_memory=False) for p in files], ignore_index=True)
              robust = build_sc1_robust_exposure(x)
              robust.insert(0, "PROTECTION_STRENGTH_LAMBDA", strength)
              details.append(robust)
              row = {"PROTECTION_STRENGTH_LAMBDA": strength, "ED_COUNT": len(robust)}
              for label, suffix in [("SO", "SO_LOSS_PCT"), ("CATTLE", "CATTLE_REDUCTION_PCT")]:
                  p = pd.to_numeric(robust[f"PATHWAY_SENSITIVITY_{suffix}"], errors="raise")
                  a = pd.to_numeric(robust[f"ALLOCATION_SENSITIVITY_{suffix}"], errors="raise")
                  row[f"{label}_PATHWAY_DOMINATED_EDS"] = int((p > a + 1e-12).sum())
                  row[f"{label}_ALLOCATION_DOMINATED_EDS"] = int((a > p + 1e-12).sum())
                  row[f"{label}_TIED_EDS"] = int((abs(p - a) <= 1e-12).sum())
                  row[f"{label}_PATHWAY_DOMINATED_PCT"] = 100.0 * row[f"{label}_PATHWAY_DOMINATED_EDS"] / len(robust)
                  row[f"{label}_ALLOCATION_DOMINATED_PCT"] = 100.0 * row[f"{label}_ALLOCATION_DOMINATED_EDS"] / len(robust)
              rows.append(row)
          summary = pd.DataFrame(rows)
          summary.to_csv(root / "protection_strength_sensitivity_summary.csv", index=False)
          pd.concat(details, ignore_index=True).to_csv(root / "protection_strength_sensitivity_ed.csv", index=False)
          print(summary.to_string(index=False))
          PY

      - name: Build final diagnostics graphs and callout maps
        run: |
          python -m goblin_spatial.manuscript_package_runner \
            "$PWD/data/processed/final_results" \
            --output-dir "$PWD/data/processed/final_results/manuscript" \
            --sensitivity-summary "$PWD/data/processed/protection_sensitivity/protection_strength_sensitivity_summary.csv"

      - name: Print manuscript gate results and callouts
        run: |
          echo "===== MANUSCRIPT KEY RESULTS ====="
          cat data/processed/final_results/manuscript/manuscript_key_results.txt
          echo "===== FIGURE 3 CALLOUTS ====="
          cat data/processed/final_results/manuscript/diagnostics/Fig03_callouts.csv
          echo "===== FIGURE 5 CALLOUTS ====="
          cat data/processed/final_results/manuscript/diagnostics/Fig05_callouts.csv
          echo "===== PROTECTION-STRENGTH SENSITIVITY ====="
          cat data/processed/protection_sensitivity/protection_strength_sensitivity_summary.csv

      - name: Confirm final manuscript package
        run: |
          set -euo pipefail
          for stem in \
            Fig02_economic_incidence \
            Fig03_exposure_geography \
            Fig04_protection_tradeoffs \
            Fig05_redistribution_geography \
            Fig06_contested_land \
            Fig07_feasibility; do
            test -f "data/processed/final_results/manuscript/figures/${stem}.png"
            test -f "data/processed/final_results/manuscript/figures/${stem}.svg"
            test -f "data/processed/final_results/manuscript/figures/${stem}.pdf"
          done
          test -f data/processed/final_results/manuscript/diagnostics/theil_baseline_comparator.csv
          test -f data/processed/final_results/manuscript/diagnostics/capability_rule_sensitivity.csv
          test -f data/processed/final_results/manuscript/diagnostics/persistence_baseline_null.csv
          test -f data/processed/final_results/manuscript/diagnostics/Fig03_callouts.csv
          test -f data/processed/final_results/manuscript/diagnostics/Fig05_callouts.csv

      - name: Publish lightweight manuscript outputs to repository
        run: |
          set -euo pipefail
          run_id=$(cat manuscript_outputs/current_run.txt)
          rm -rf manuscript_outputs/diagnostics manuscript_outputs/figures
          mkdir -p manuscript_outputs/diagnostics manuscript_outputs/figures
          printf '%s\n' "$run_id" > manuscript_outputs/current_run.txt
          cp data/processed/final_results/manuscript/manuscript_key_results.txt manuscript_outputs/
          cp data/processed/final_results/manuscript/manuscript_figure_manifest.csv manuscript_outputs/
          cp data/processed/final_results/manuscript/diagnostics/*.csv manuscript_outputs/diagnostics/
          cp data/processed/protection_sensitivity/protection_strength_sensitivity_summary.csv manuscript_outputs/diagnostics/
          cp data/processed/final_results/manuscript/figures/*.svg manuscript_outputs/figures/
          git add manuscript_outputs
          git commit -m "Publish reproducible manuscript diagnostics and SVG figures [skip ci]" || exit 0
          git push

      - name: Upload compact manuscript package
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-manuscript-results
          path: |
            data/processed/final_results/manuscript
            data/processed/protection_sensitivity/protection_strength_sensitivity_summary.csv
            data/processed/protection_sensitivity/protection_strength_sensitivity_ed.csv
          if-no-files-found: error
          retention-days: 30
