name: lpis-rebuild

on:
  workflow_dispatch:

jobs:
  rebuild-lpis-ed-control:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo]"

      - name: Fetch frozen SAPS geography
        run: goblin-spatial fetch-data

      - name: Download version-pinned LPIS snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/external/spatial/lpis
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          pins = yaml.safe_load(Path("LPIS_SOURCE_PINS.yaml").read_text(encoding="utf-8"))
          for key in ("lpis_2020_corrected_v2", "lpis_2025_validated_v1"):
              source = pins["sources"][key]
              record = int(source["record_id"])
              filename = source["filename"]
              path = Path(source["configured_path"])
              path.parent.mkdir(parents=True, exist_ok=True)
              url = f"https://zenodo.org/records/{record}/files/{filename}?download=1"
              print(f"Downloading {key}: {url}")
              subprocess.run(
                  ["curl", "-L", "--fail", "--retry", "4", "--retry-delay", "5", "-o", str(path), url],
                  check=True,
              )
          PY

      - name: Verify LPIS source checksums
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import yaml

          pins = yaml.safe_load(Path("LPIS_SOURCE_PINS.yaml").read_text(encoding="utf-8"))
          for key, source in pins["sources"].items():
              path = Path(source["configured_path"])
              digest = hashlib.md5(path.read_bytes()).hexdigest()
              expected = str(source["zenodo_md5"]).lower()
              assert digest == expected, (key, digest, expected)
              print(f"{key}: MD5 verified {digest}; bytes={path.stat().st_size:,}")
          PY

      - name: Inspect corrected LPIS source schemas
        run: |
          python - <<'PY'
          from pathlib import Path
          import pyarrow.parquet as pq
          import yaml

          pins = yaml.safe_load(Path("LPIS_SOURCE_PINS.yaml").read_text(encoding="utf-8"))
          for key, source in pins["sources"].items():
              path = Path(source["configured_path"])
              parquet = pq.ParquetFile(path)
              names = set(parquet.schema_arrow.names)
              print(f"{key}: rows={parquet.metadata.num_rows:,}; row_groups={parquet.metadata.num_row_groups}")
              print("columns:", ", ".join(parquet.schema_arrow.names))
              assert "CLAIMED_AREA_HA" in names, key
              assert "geometry" in names, key
              if key == "lpis_2020_corrected_v2":
                  assert "COMMONAGE_FRACTION" in names or {"COM_NUM", "COM_DEN"}.issubset(names), names
                  assert "SHARE_DIGITISED_HA" in names, names
                  assert "SHARE_ELIGIBLE_HA" in names, names
                  assert "LAND_USE_GROUP" in names, names
          PY

      - name: Rebuild 2020 and 2025 ED LPIS control
        run: goblin-spatial-lpis --year both --batch-size 100000

      - name: Validate dual-baseline LPIS control
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          import yaml

          pins = yaml.safe_load(Path("LPIS_SOURCE_PINS.yaml").read_text(encoding="utf-8"))
          expected_eds = int(pins["spatial_bridge"]["expected_model_eds"])
          expected_rows = int(pins["spatial_bridge"]["expected_lpis_ed_profile_rows"])
          path = Path("data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz")
          frame = pd.read_csv(path, low_memory=False)

          assert len(frame) == expected_rows, len(frame)
          assert set(frame["LPIS_YEAR"].astype(int)) == {2020, 2025}
          counts = frame.groupby("LPIS_YEAR").size().to_dict()
          assert counts == {2020: expected_eds, 2025: expected_eds}, counts
          assert not frame[["LPIS_YEAR", "CSOED_CANONICAL"]].duplicated().any()

          keys_2020 = set(frame.loc[frame["LPIS_YEAR"].eq(2020), "CSOED_CANONICAL"].astype(str))
          keys_2025 = set(frame.loc[frame["LPIS_YEAR"].eq(2025), "CSOED_CANONICAL"].astype(str))
          assert keys_2020 == keys_2025
          assert len(keys_2020) == expected_eds

          missing_commonage = pd.to_numeric(
              frame["LPIS_SNAPSHOT_COMMONAGE_FRACTION_MISSING_RECORDS"], errors="raise"
          )
          assert missing_commonage.eq(0).all(), missing_commonage.unique()
          complete = frame["LPIS_SNAPSHOT_ADJUSTED_AREA_COMPLETE"].astype(str).str.lower()
          assert complete.isin({"true", "1"}).all(), complete.unique()
          assert frame["LPIS_SNAPSHOT_ADJUSTED_AREA_STATUS"].eq("COMPLETE").all()

          area_columns = [
              "LPIS_CLAIMED_AG_HA",
              "LPIS_ELIGIBLE_AG_HA",
              "LPIS_CLAIMED_GRASS_HA",
              "LPIS_ELIGIBLE_GRASS_HA",
              "LPIS_COMMONAGE_GRASS_HA",
          ]
          for column in area_columns:
              values = pd.to_numeric(frame[column], errors="raise").to_numpy(float)
              assert np.isfinite(values).all(), column
              assert (values >= -1e-9).all(), column

          claimed = pd.to_numeric(frame["LPIS_CLAIMED_GRASS_HA"], errors="raise").to_numpy(float)
          commonage = pd.to_numeric(frame["LPIS_COMMONAGE_GRASS_HA"], errors="raise").to_numpy(float)
          assert (commonage <= claimed + 1e-8).all()

          grass_subtypes = [
              "LPIS_PERMANENT_PASTURE_HA",
              "LPIS_LOW_INPUT_GRASS_HA",
              "LPIS_TEMPORARY_GRASS_HA",
              "LPIS_HAY_MEADOW_HA",
              "LPIS_PEAT_GRASS_HA",
              "LPIS_RIPARIAN_GRASS_HA",
              "LPIS_OTHER_GRASS_HA",
          ]
          subtype_sum = frame[grass_subtypes].apply(pd.to_numeric, errors="raise").sum(axis=1)
          partition_error = (subtype_sum - pd.to_numeric(frame["LPIS_CLAIMED_GRASS_HA"], errors="raise")).abs()
          assert float(partition_error.max()) <= 1e-6, float(partition_error.max())

          context_columns = [
              "LPIS_FORESTRY_EXISTING_CONTEXT_HA",
              "LPIS_FORESTRY_ELIGIBLE_CONTEXT_HA",
          ]
          totals = {
              year: {
                  column: float(
                      pd.to_numeric(
                          frame.loc[frame["LPIS_YEAR"].eq(year), column],
                          errors="raise",
                      ).sum()
                  )
                  for column in [*grass_subtypes, *context_columns]
              }
              for year in (2020, 2025)
          }
          assert 3_500_000 < totals[2020]["LPIS_PERMANENT_PASTURE_HA"] < 3_800_000, totals[2020]
          assert totals[2020]["LPIS_LOW_INPUT_GRASS_HA"] > 200_000, totals[2020]
          assert totals[2020]["LPIS_FORESTRY_EXISTING_CONTEXT_HA"] > 0, totals[2020]
          assert totals[2025]["LPIS_FORESTRY_ELIGIBLE_CONTEXT_HA"] > 0, totals[2025]

          summary = {
              "rows": int(len(frame)),
              "eds_per_snapshot": counts,
              "claimed_ag_ha": {
                  str(year): float(frame.loc[frame["LPIS_YEAR"].eq(year), "LPIS_CLAIMED_AG_HA"].sum())
                  for year in (2020, 2025)
              },
              "claimed_grass_ha": {
                  str(year): float(frame.loc[frame["LPIS_YEAR"].eq(year), "LPIS_CLAIMED_GRASS_HA"].sum())
                  for year in (2020, 2025)
              },
              "eligible_grass_ha": {
                  str(year): float(frame.loc[frame["LPIS_YEAR"].eq(year), "LPIS_ELIGIBLE_GRASS_HA"].sum())
                  for year in (2020, 2025)
              },
              "grass_subtype_totals_ha": {str(year): totals[year] for year in (2020, 2025)},
              "grass_subtype_partition_max_abs_error_ha": float(partition_error.max()),
          }
          Path("data/controls/lpis/LPIS_ED_validation_summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          print("Dual-baseline LPIS ED control reproduced and validated successfully")
          PY

      - name: Upload compact LPIS control and QA summary
        uses: actions/upload-artifact@v4
        with:
          name: ED-LPIS-opportunity-2020-2025
          path: |
            data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz
            data/controls/lpis/LPIS_ED_validation_summary.json
          if-no-files-found: error
          retention-days: 14
