name: lpis-rebuild

# Optional first-principles reconstruction only.
# Normal historical and SC1-SC3 runtime never invoke this workflow.
on:
  workflow_dispatch:

jobs:
  rebuild-lpis-ed-control:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo]"

      - name: Explicitly fetch optional reconstruction sources
        run: |
          goblin-spatial fetch-data --include-reconstruction-sources

      - name: Rebuild 2020 and 2025 ED LPIS control from pinned sources
        run: |
          goblin-spatial-lpis \
            --year both \
            --batch-size 100000 \
            --ed-shapefile data/inputs/spatial/SC2_ED_Boundaries_Frozen.gpkg \
            --lpis-2020 data/inputs/spatial/SC2_LPIS_2020_Frozen.parquet \
            --lpis-2025 data/inputs/spatial/SC2_LPIS_2025_Frozen.parquet

      - name: Validate reconstructed dual-baseline LPIS control
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          import numpy as np
          import pandas as pd

          path = Path("data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz")
          frame = pd.read_csv(path, low_memory=False)

          expected_eds = 2857
          assert len(frame) == 2 * expected_eds, len(frame)
          assert set(pd.to_numeric(frame["LPIS_YEAR"], errors="raise").astype(int)) == {2020, 2025}
          counts = frame.groupby("LPIS_YEAR").size().to_dict()
          assert counts == {2020: expected_eds, 2025: expected_eds}, counts

          key_col = "CSOED_CANONICAL" if "CSOED_CANONICAL" in frame.columns else "CSOED"
          assert not frame[["LPIS_YEAR", key_col]].duplicated().any()
          keys_2020 = set(frame.loc[frame["LPIS_YEAR"].eq(2020), key_col].astype(str))
          keys_2025 = set(frame.loc[frame["LPIS_YEAR"].eq(2025), key_col].astype(str))
          assert keys_2020 == keys_2025
          assert len(keys_2020) == expected_eds

          area_columns = [
              "LPIS_CLAIMED_AG_HA",
              "LPIS_ELIGIBLE_AG_HA",
              "LPIS_CLAIMED_GRASS_HA",
              "LPIS_ELIGIBLE_GRASS_HA",
              "LPIS_COMMONAGE_GRASS_HA",
          ]
          for column in area_columns:
              values = pd.to_numeric(frame[column], errors="raise").to_numpy(float)
              assert np.isfinite(values).all(), column
              assert (values >= -1e-9).all(), column

          claimed = pd.to_numeric(frame["LPIS_CLAIMED_GRASS_HA"], errors="raise")
          commonage = pd.to_numeric(frame["LPIS_COMMONAGE_GRASS_HA"], errors="raise")
          assert (commonage <= claimed + 1e-8).all()

          grass_subtypes = [
              column
              for column in (
                  "LPIS_PERMANENT_PASTURE_HA",
                  "LPIS_LOW_INPUT_GRASS_HA",
                  "LPIS_TEMPORARY_GRASS_HA",
                  "LPIS_HAY_MEADOW_HA",
                  "LPIS_PEAT_GRASS_HA",
                  "LPIS_RIPARIAN_GRASS_HA",
                  "LPIS_OTHER_GRASS_HA",
              )
              if column in frame.columns
          ]
          partition = frame[grass_subtypes].apply(pd.to_numeric, errors="coerce").fillna(0.0).sum(axis=1)
          partition_error = (partition - claimed).abs()
          assert float(partition_error.max()) <= 1e-6, float(partition_error.max())

          summary = {
              "rows": int(len(frame)),
              "eds_per_snapshot": {str(key): int(value) for key, value in counts.items()},
              "claimed_grass_ha": {
                  str(year): float(
                      pd.to_numeric(
                          frame.loc[frame["LPIS_YEAR"].eq(year), "LPIS_CLAIMED_GRASS_HA"],
                          errors="raise",
                      ).sum()
                  )
                  for year in (2020, 2025)
              },
              "grass_subtype_partition_max_abs_error_ha": float(partition_error.max()),
              "runtime_role": "OPTIONAL_FIRST_PRINCIPLES_RECONSTRUCTION_ONLY",
          }
          Path("data/controls/lpis/LPIS_ED_validation_summary.json").write_text(
              json.dumps(summary, indent=2), encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload reconstructed compact LPIS control and QA summary
        uses: actions/upload-artifact@v4
        with:
          name: ED-LPIS-opportunity-2020-2025-reconstruction
          path: |
            data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz
            data/controls/lpis/LPIS_ED_validation_summary.json
          if-no-files-found: error
          retention-days: 14
