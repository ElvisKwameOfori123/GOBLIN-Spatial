name: final principal results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-results.yml"

jobs:
  principal-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin,scenario]"

      - name: Verify frozen runtime inputs
        run: goblin-spatial fetch-data --verify-only

      - name: Build canonical historical baseline
        run: goblin-spatial build --config configs/ireland_2015_2025.yaml

      - name: Run full 3 x 4 principal matrix
        shell: bash
        run: |
          set -euo pipefail
          scenarios=(SI_SG BE_SG ALL_GAS_NZ)
          rules=(PRORATA DAIRY_PROTECTION ECONOMIC_CAPACITY_PROTECTION SOCIAL_VULNERABILITY_PROTECTION)
          root="$PWD/data/processed/final_principal"
          mkdir -p "$root"
          for scenario in "${scenarios[@]}"; do
            for rule in "${rules[@]}"; do
              out="$root/${scenario}_2020_${rule}"
              echo "Running ${scenario} x ${rule}"
              goblin-spatial-principal "$scenario" \
                --baseline-year 2020 \
                --allocation-rule "$rule" \
                --stage SC3 \
                --output-dir "$out"
            done
          done

      - name: Validate exact 12-run matrix
        shell: bash
        run: |
          set -euo pipefail
          test "$(find data/processed/final_principal -name sc3_national_summary.csv | wc -l)" -eq 12
          test "$(find data/processed/final_principal -name sc3_ed_results.csv | wc -l)" -eq 12
          test "$(find data/processed/final_principal -name sc2_ed_context.csv | wc -l)" -eq 12
          test "$(find data/processed/final_principal -name sc1_ed_results.csv | wc -l)" -eq 12

      - name: Upload canonical 12-run matrix
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-principal-matrix
          path: data/processed/final_principal
          if-no-files-found: error
          retention-days: 30

  final-publication-package:
    needs: principal-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin,scenario]"

      - name: Download canonical matrix
        uses: actions/download-artifact@v4
        with:
          name: GOBLIN-Spatial-principal-matrix
          path: data/processed/final_principal

      - name: Build final scientific package efficiently
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          import pandas as pd
          import goblin_spatial.study_reporting as base
          import goblin_spatial.final_study_reporting as final

          root = Path("data/processed/final_principal").resolve()
          out = Path("data/processed/final_results").resolve()
          out.mkdir(parents=True, exist_ok=True)

          def sqlite_safe_frame(frame: pd.DataFrame, table_name: str):
              safe = frame.copy()
              used = set()
              columns = []
              mappings = []
              for original in [str(c) for c in safe.columns]:
                  candidate = original
                  if candidate.casefold() in used:
                      number = 2
                      candidate = f"{original}__SQLITE_CASE_VARIANT_{number}"
                      while candidate.casefold() in used:
                          number += 1
                          candidate = f"{original}__SQLITE_CASE_VARIANT_{number}"
                      mappings.append({
                          "TABLE_NAME": table_name,
                          "ORIGINAL_COLUMN": original,
                          "SQLITE_COLUMN": candidate,
                          "REASON": "SQLite identifiers are case-insensitive; scientific values retained under an explicit non-colliding alias.",
                      })
                  used.add(candidate.casefold())
                  columns.append(candidate)
              safe.columns = columns
              return safe, mappings

          def safe_write_sqlite(path: Path, tables: dict[str, pd.DataFrame], figure_data: pd.DataFrame):
              if path.exists():
                  path.unlink()
              mapping_rows = []
              with sqlite3.connect(path) as con:
                  for name, frame in tables.items():
                      safe, mappings = sqlite_safe_frame(frame, name)
                      mapping_rows.extend(mappings)
                      safe.to_sql(name, con, if_exists="replace", index=False)
                  safe_fig, mappings = sqlite_safe_frame(figure_data, "figure_data")
                  mapping_rows.extend(mappings)
                  safe_fig.to_sql("figure_data", con, if_exists="replace", index=False)
                  pd.DataFrame(mapping_rows, columns=["TABLE_NAME", "ORIGINAL_COLUMN", "SQLITE_COLUMN", "REASON"]).to_sql(
                      "report_column_mapping", con, if_exists="replace", index=False
                  )
                  pd.DataFrame([{"reporting_version": base.STUDY_REPORTING_VERSION}]).to_sql(
                      "report_metadata", con, if_exists="replace", index=False
                  )
                  con.execute("CREATE INDEX IF NOT EXISTS idx_sc1_ed_run ON sc1_ed (STUDY_SCENARIO_ID, STUDY_ALLOCATION_POLICY, CSOED)")
                  con.execute("CREATE INDEX IF NOT EXISTS idx_sc3_ed_run ON sc3_ed (STUDY_SCENARIO_ID, STUDY_ALLOCATION_POLICY, CSOED)")
                  con.execute("CREATE INDEX IF NOT EXISTS idx_county_run ON county (STUDY_SCENARIO_ID, STUDY_ALLOCATION_POLICY)")
                  con.commit()

          def lean_base_export(study_root, *, output_dir=None, require_complete_matrix=True, generate_figures=False):
              study_root = Path(study_root).resolve()
              output = Path(output_dir).resolve() if output_dir is not None else study_root / "final_results"
              output.mkdir(parents=True, exist_ok=True)
              bundles = [base._load_run(path) for path in base._discover_run_dirs(study_root)]
              base._validate_matrix(bundles, require_complete_matrix=require_complete_matrix)
              bundles = sorted(
                  bundles,
                  key=lambda b: (
                      base.PRINCIPAL_SCENARIOS.index(b.scenario_id),
                      base.PRINCIPAL_RULES.index(b.allocation_policy),
                  ),
              )
              tables = base._combined_frames(bundles)
              figure_data = base._figure_data(tables)
              sqlite_path = output / "GOBLIN_Spatial_Final_Results.sqlite"
              safe_write_sqlite(sqlite_path, tables, figure_data)
              figure_csv = output / "GOBLIN_Spatial_Figure_Data_BASE.csv"
              figure_data.to_csv(figure_csv, index=False)
              return {
                  "sqlite": sqlite_path,
                  "figure_data_csv": figure_csv,
                  "figure_directory": output / "figures",
              }

          def compact_workbook(path: Path, tables: dict[str, pd.DataFrame], figure_paths, study_root: Path):
              # Full raw ED tables remain losslessly available in SQLite and in the
              # canonical 12-run artifact. Excel is the human-facing results surface.
              sheets = [
                  ("00_Read_Me", final._read_me(study_root)),
                  ("01_Scenario_Design", tables["run_registry"]),
                  ("02_Headline_Results", tables["headline_results"]),
                  ("03_National_Pathways", tables["national_results"]),
                  ("04_SC1_Livestock", tables["livestock"]),
                  ("05_SC1_Distribution", tables["distribution_summary"]),
                  ("06_SC1_Protection", tables["redistribution"]),
                  ("07_SC1_Persistence", tables["persistence"]),
                  ("08_SC1_Robustness", tables["robust_exposure"]),
                  ("09_SC1_Land_Release", tables["land_release_summary"]),
                  ("10_SC2_Opportunity", tables["opportunity_summary"]),
                  ("11_Transition_Conditions", tables["transition_conditions"]),
                  ("12_Opportunity_Mobilisation", tables["opportunity_mobilisation"]),
                  ("13_SC3_Target_Realised", tables["sc3_national"]),
                  ("14_SC3_Shared_Pools", tables["shared_pool_summary"]),
                  ("15_SC3_Rewetting", tables["rewetting_summary"]),
                  ("16_SC3_Land_Accounting", tables["land_accounting"]),
                  ("17_County_Results", tables["county"]),
                  ("18_Map_Data", tables["map_data"]),
                  ("19_Figure_Data", tables["figure_data"]),
                  ("20_Validation", tables["validation"]),
                  ("21_Reconciliation", tables["reconciliation"]),
                  ("22_Data_Dictionary", final._data_dictionary()),
              ]
              with pd.ExcelWriter(path, engine="xlsxwriter", engine_kwargs={"options": {"strings_to_urls": False}}) as writer:
                  for name, frame in sheets:
                      frame.to_excel(writer, sheet_name=name, index=False)
                      final._format_sheet(writer, name, frame)
                  ws = writer.book.add_worksheet("23_Figures")
                  writer.sheets["23_Figures"] = ws
                  ws.hide_gridlines(2)
                  ws.set_column("A:A", 3)
                  ws.set_column("B:N", 14)
                  row = 1
                  for png in [p for p in figure_paths if p.suffix.lower() == ".png"]:
                      ws.write(row, 1, png.stem.replace("_", " ").title())
                      ws.insert_image(row + 1, 1, str(png), {"x_scale": 0.70, "y_scale": 0.70})
                      row += 27

          base._write_sqlite = safe_write_sqlite
          final._base_export_study_results = lean_base_export
          final._write_workbook = compact_workbook

          outputs = final.export_study_results(
              root,
              output_dir=out,
              require_complete_matrix=True,
              generate_figures=True,
          )
          for label, path in outputs.items():
              print(f"{label}: {path}")
          PY

      - name: Build high-impact manuscript figure suite
        run: |
          goblin-spatial-paper-figures \
            "$PWD/data/processed/final_results/GOBLIN_Spatial_Final_Results.sqlite" \
            --output-dir "$PWD/data/processed/final_results/paper_figures"

      - name: Build final spatial map package
        run: |
          goblin-spatial maps \
            "$PWD/data/processed/final_results" \
            --output-dir "$PWD/data/processed/final_results/maps"

      - name: Confirm final package
        shell: bash
        run: |
          set -euo pipefail
          test -f data/processed/final_results/GOBLIN_Spatial_Final_Results_Master.xlsx
          test -f data/processed/final_results/GOBLIN_Spatial_Final_Results.sqlite
          test -f data/processed/final_results/GOBLIN_Spatial_Figure_Data.csv
          test -f data/processed/final_results/GOBLIN_Spatial_Map_Data.csv
          test -f data/processed/final_results/GOBLIN_Spatial_Transition_Conditions.csv
          test "$(python - <<'PY'
          import pandas as pd
          x = pd.read_csv('data/processed/final_results/GOBLIN_Spatial_Map_Data.csv', low_memory=False)
          print(len(x))
          PY
          )" -eq 34284
          test -f data/processed/final_results/paper_figures/paper_fig01_national_transition.png
          test -f data/processed/final_results/paper_figures/paper_fig03_protection_redistribution.png
          test -f data/processed/final_results/paper_figures/paper_fig07_target_delivery.png
          test -f data/processed/final_results/maps/GOBLIN_Spatial_Model_ED_Geometry.gpkg
          test -f data/processed/final_results/maps/GOBLIN_Spatial_Map_Layer.gpkg
          test -f data/processed/final_results/maps/map01_persistent_exposure.png
          test -f data/processed/final_results/maps/map02_standard_output_exposure.png
          test -f data/processed/final_results/maps/map03_protection_redistribution.png
          test -f data/processed/final_results/maps/map04_exposure_opportunity.png
          test -f data/processed/final_results/maps/map05_alternative_use_uptake.png
          test -f data/processed/final_results/maps/map06_final_unallocated_land.png

      - name: Upload final scientific results
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-final-results
          path: data/processed/final_results
          if-no-files-found: error
          retention-days: 30
