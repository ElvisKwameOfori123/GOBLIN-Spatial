name: final principal results

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-results.yml"

jobs:
  final-results:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin,scenario]"

      - name: Verify frozen runtime inputs
        run: goblin-spatial fetch-data --verify-only

      - name: Build canonical historical baseline
        run: goblin-spatial build --config configs/ireland_2015_2025.yaml

      - name: Run full 3 x 4 principal matrix
        shell: bash
        run: |
          set -euo pipefail
          scenarios=(SI_SG BE_SG ALL_GAS_NZ)
          rules=(PRORATA DAIRY_PROTECTION ECONOMIC_CAPACITY_PROTECTION SOCIAL_VULNERABILITY_PROTECTION)
          root="$PWD/data/processed/final_principal"
          mkdir -p "$root"
          for scenario in "${scenarios[@]}"; do
            for rule in "${rules[@]}"; do
              out="$root/${scenario}_2020_${rule}"
              echo "Running ${scenario} x ${rule}"
              goblin-spatial-principal "$scenario" \
                --baseline-year 2020 \
                --allocation-rule "$rule" \
                --stage SC3 \
                --output-dir "$out"
            done
          done

      - name: Build final workbook database and diagnostic figures
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          import pandas as pd
          import goblin_spatial.study_reporting as base_reporting

          def sqlite_safe_frame(frame: pd.DataFrame, table_name: str):
              out = frame.copy()
              used = set()
              safe_columns = []
              mappings = []
              for original in [str(c) for c in out.columns]:
                  candidate = original
                  folded = candidate.casefold()
                  if folded in used:
                      number = 2
                      candidate = f"{original}__SQLITE_CASE_VARIANT_{number}"
                      while candidate.casefold() in used:
                          number += 1
                          candidate = f"{original}__SQLITE_CASE_VARIANT_{number}"
                      mappings.append(
                          {
                              "TABLE_NAME": table_name,
                              "ORIGINAL_COLUMN": original,
                              "SQLITE_COLUMN": candidate,
                              "REASON": "SQLite column names are case-insensitive; values retained under an explicit non-colliding name.",
                          }
                      )
                  used.add(candidate.casefold())
                  safe_columns.append(candidate)
              out.columns = safe_columns
              return out, mappings

          def safe_write_sqlite(path: Path, tables: dict[str, pd.DataFrame], figure_data: pd.DataFrame) -> None:
              if path.exists():
                  path.unlink()
              mapping_rows = []
              with sqlite3.connect(path) as connection:
                  for name, frame in tables.items():
                      safe, mappings = sqlite_safe_frame(frame, name)
                      mapping_rows.extend(mappings)
                      safe.to_sql(name, connection, if_exists="replace", index=False)
                  safe_fig, mappings = sqlite_safe_frame(figure_data, "figure_data")
                  mapping_rows.extend(mappings)
                  safe_fig.to_sql("figure_data", connection, if_exists="replace", index=False)
                  pd.DataFrame(mapping_rows, columns=["TABLE_NAME", "ORIGINAL_COLUMN", "SQLITE_COLUMN", "REASON"]).to_sql(
                      "sqlite_column_mapping", connection, if_exists="replace", index=False
                  )
                  pd.DataFrame(
                      [{"reporting_version": base_reporting.STUDY_REPORTING_VERSION, "table_count": len(tables) + 2}]
                  ).to_sql("report_metadata", connection, if_exists="replace", index=False)
                  connection.execute("CREATE INDEX IF NOT EXISTS idx_sc1_ed_run ON sc1_ed (STUDY_SCENARIO_ID, STUDY_ALLOCATION_POLICY, CSOED)")
                  connection.execute("CREATE INDEX IF NOT EXISTS idx_sc3_ed_run ON sc3_ed (STUDY_SCENARIO_ID, STUDY_ALLOCATION_POLICY, CSOED)")
                  connection.execute("CREATE INDEX IF NOT EXISTS idx_county_run ON county (STUDY_SCENARIO_ID, STUDY_ALLOCATION_POLICY)")
                  connection.commit()

          base_reporting._write_sqlite = safe_write_sqlite
          from goblin_spatial.final_study_reporting import export_study_results

          outputs = export_study_results(
              Path("data/processed/final_principal"),
              output_dir=Path("data/processed/final_results"),
              require_complete_matrix=True,
              generate_figures=True,
          )
          for label, path in outputs.items():
              print(f"{label}: {path}")
          PY

      - name: Build high-impact manuscript figure suite
        run: |
          goblin-spatial-paper-figures \
            "$PWD/data/processed/final_results/GOBLIN_Spatial_Final_Results.sqlite" \
            --output-dir "$PWD/data/processed/final_results/paper_figures"

      - name: Build final spatial map package
        run: |
          goblin-spatial maps \
            "$PWD/data/processed/final_results" \
            --output-dir "$PWD/data/processed/final_results/maps"

      - name: Confirm final package
        run: |
          test -f data/processed/final_results/GOBLIN_Spatial_Final_Results_Master.xlsx
          test -f data/processed/final_results/GOBLIN_Spatial_Final_Results.sqlite
          test -f data/processed/final_results/GOBLIN_Spatial_Figure_Data.csv
          test -f data/processed/final_results/GOBLIN_Spatial_Map_Data.csv
          test -f data/processed/final_results/GOBLIN_Spatial_Transition_Conditions.csv
          test -f data/processed/final_results/figures/fig01_livestock_endpoint.png
          test -f data/processed/final_results/figures/fig03_released_land_allocation.png
          test -f data/processed/final_results/figures/fig04_transition_concentration.svg
          test -f data/processed/final_results/figures/fig05_protection_redistribution.png
          test -f data/processed/final_results/figures/fig06_pathway_allocation_sensitivity.svg
          test -f data/processed/final_results/figures/fig07_persistent_exposure.png
          test -f data/processed/final_results/figures/fig08_within_between_heterogeneity.svg
          test -f data/processed/final_results/figures/fig09_released_land_systems.png
          test -f data/processed/final_results/figures/fig10_released_land_soil.svg
          test -f data/processed/final_results/figures/fig11_exposure_forest_opportunity.png
          test -f data/processed/final_results/figures/fig12_target_realised_unmet.svg
          test -f data/processed/final_results/figures/fig13_land_accounting.png
          test -f data/processed/final_results/figures/fig14_opportunity_mobilisation.svg
          test -f data/processed/final_results/paper_figures/paper_fig01_national_transition.png
          test -f data/processed/final_results/paper_figures/paper_fig02_transition_concentration.svg
          test -f data/processed/final_results/paper_figures/paper_fig03_protection_redistribution.png
          test -f data/processed/final_results/paper_figures/paper_fig04_persistence_sensitivity.svg
          test -f data/processed/final_results/paper_figures/paper_fig05_released_land_composition.png
          test -f data/processed/final_results/paper_figures/paper_fig06_transition_conditions.svg
          test -f data/processed/final_results/paper_figures/paper_fig07_target_delivery.png
          test -f data/processed/final_results/paper_figures/paper_fig08_opportunity_constraints.svg
          test -f data/processed/final_results/paper_figures/GOBLIN_Spatial_Paper_Figure_Manifest.csv
          test -f data/processed/final_results/maps/GOBLIN_Spatial_Model_ED_Geometry.gpkg
          test -f data/processed/final_results/maps/GOBLIN_Spatial_Map_Layer.gpkg
          test -f data/processed/final_results/maps/GOBLIN_Spatial_Map_Manifest.csv
          test -f data/processed/final_results/maps/map01_persistent_exposure.png
          test -f data/processed/final_results/maps/map02_standard_output_exposure.png
          test -f data/processed/final_results/maps/map03_protection_redistribution.png
          test -f data/processed/final_results/maps/map04_exposure_opportunity.png
          test -f data/processed/final_results/maps/map05_alternative_use_uptake.png
          test -f data/processed/final_results/maps/map06_final_unallocated_land.png

      - name: Upload final scientific results
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-final-results
          path: data/processed/final_results
          if-no-files-found: error
          retention-days: 30
