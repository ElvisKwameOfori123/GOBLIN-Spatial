name: lpis-profile-build

on:
  push:
    branches: [agent/ed-dynamics-foundation]

jobs:
  build-lpis-ed-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo]"

      - name: Fetch frozen ED geography
        run: goblin-spatial fetch-data

      - name: Build LPIS 2020 ED profile
        shell: bash
        run: |
          mkdir -p data/external/spatial/lpis data/interim/lpis
          curl -L --fail --retry 5 --retry-delay 10 \
            "https://zenodo.org/records/21918924/files/LPIS_2020_GOBLIN_reduced.parquet?download=1" \
            -o data/external/spatial/lpis/LPIS_2020_GOBLIN_reduced.parquet
          echo "8aecea62feb13082364a99c76101ef39  data/external/spatial/lpis/LPIS_2020_GOBLIN_reduced.parquet" | md5sum -c -
          goblin-spatial-lpis \
            --year 2020 \
            --batch-size 50000 \
            --output data/interim/lpis/ED_LPIS_2020.csv.xz
          rm data/external/spatial/lpis/LPIS_2020_GOBLIN_reduced.parquet

      - name: Build LPIS 2025 ED profile
        shell: bash
        run: |
          curl -L --fail --retry 5 --retry-delay 10 \
            "https://zenodo.org/records/21918924/files/LPIS_2025_GOBLIN_reduced.parquet?download=1" \
            -o data/external/spatial/lpis/LPIS_2025_GOBLIN_reduced.parquet
          echo "8c10e49514997b9bedec77bebd5d52ed  data/external/spatial/lpis/LPIS_2025_GOBLIN_reduced.parquet" | md5sum -c -
          goblin-spatial-lpis \
            --year 2025 \
            --batch-size 50000 \
            --output data/interim/lpis/ED_LPIS_2025.csv.xz
          rm data/external/spatial/lpis/LPIS_2025_GOBLIN_reduced.parquet

      - name: Combine and validate ED snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          p20 = Path("data/interim/lpis/ED_LPIS_2020.csv.xz")
          p25 = Path("data/interim/lpis/ED_LPIS_2025.csv.xz")
          out = Path("data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz")
          out.parent.mkdir(parents=True, exist_ok=True)

          df = pd.concat([pd.read_csv(p20), pd.read_csv(p25)], ignore_index=True)
          assert len(df) == 5714, len(df)
          assert set(df["LPIS_YEAR"].astype(int)) == {2020, 2025}
          assert df.groupby("LPIS_YEAR").size().to_dict() == {2020: 2857, 2025: 2857}
          assert not df[["LPIS_YEAR", "CSOED_CANONICAL"]].duplicated().any()
          assert (df["LPIS_CLAIMED_AG_HA"] >= -1e-9).all()
          assert (df["LPIS_CLAIMED_GRASS_HA"] >= -1e-9).all()
          assert (df["LPIS_CLAIMED_GRASS_HA"] <= df["LPIS_CLAIMED_AG_HA"] + 1e-7).all()
          assert df["LPIS_CLAIMED_AG_HA"].sum() > 1_000_000
          df.to_csv(out, index=False, compression="xz", float_format="%.10f")

          print(df.groupby("LPIS_YEAR")[[
              "LPIS_CLAIMED_AG_HA",
              "LPIS_ELIGIBLE_AG_HA",
              "LPIS_CLAIMED_GRASS_HA",
              "LPIS_ELIGIBLE_GRASS_HA",
          ]].sum())
          print(f"Wrote {out} with {len(df):,} rows")
          PY

      - name: Upload compact ED LPIS control
        uses: actions/upload-artifact@v4
        with:
          name: ED_LPIS_opportunity_2020_2025
          path: data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz
          if-no-files-found: error
          retention-days: 14
