name: spatial-smoke

on:
  workflow_dispatch:

jobs:
  zenodo-soil-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install geospatial package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo]"

      - name: Fetch frozen Zenodo spatial rebuild inputs
        run: goblin-spatial fetch-data

      - name: Build neutral ED x SIS overlay
        run: python scripts/build_ed_sis_association_overlay.py

      - name: Validate clean-room spatial reproduction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/interim/soil/ED_SIS_overlay_diagnostics.json")
          d = json.loads(path.read_text())
          assert d["baseline_rows"] == 2857, d
          assert d["baseline_unique_keys"] == 2857, d
          assert d["ed_rows_selected"] == 2857, d
          assert d["missing_baseline_keys"] == 0, d
          assert d["eds_with_soil"] == 2857, d
          assert d["soil_associations"] == 69, d
          assert d["mean_soil_coverage"] >= 0.99, d
          assert d["median_soil_coverage"] >= 0.99, d
          print("Zenodo spatial rebuild smoke test reproduced successfully")
          PY
