name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin]"
          pip install pytest

      - name: Verify Git-tracked inputs
        run: goblin-spatial fetch-data --verify-only --tracked-only

      - name: Probe authoritative GOBLIN pasture-DM profile
        run: pytest -q -s tests/test_goblin_adapter.py::test_real_upstream_goblin_2020_pasture_profile_contract

      - name: Run compact-data tests
        run: pytest -q -m "not full_data"

      - name: Detect complete full-data bundle
        id: full_data
        shell: bash
        run: |
          if [[ -f data/raw/cattle/CSO_ED_2020.csv && -f data/raw/land/AQA06_Unpivoted_2013_2025.csv ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Complete full-data inputs detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Full-data inputs not yet present; full regression will be skipped."
          fi

      - name: Verify complete input manifest
        if: steps.full_data.outputs.available == 'true'
        run: goblin-spatial fetch-data --verify-only

      - name: Run full 2015-2025 regression
        if: steps.full_data.outputs.available == 'true'
        run: pytest -q -s -m full_data

      - name: Clone-style CLI acceptance for 2020 and 2025
        if: steps.full_data.outputs.available == 'true'
        run: |
          rm -rf data/processed/ci_scenario_2020 data/processed/ci_scenario_2025
          goblin-spatial run-all \
            --baseline-year 2020 \
            --target-year 2050 \
            --dairy-reduction 0.30 \
            --suckler-reduction 0.30 \
            --output-dir data/processed/ci_scenario_2020
          goblin-spatial scenario \
            --baseline-year 2025 \
            --target-year 2050 \
            --dairy-reduction 0.30 \
            --suckler-reduction 0.30 \
            --output-dir data/processed/ci_scenario_2025
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          expected = {
              "scenario_schedule.csv",
              "scenario_national_summary.csv",
              "scenario_ed_results.csv",
              "baseline_ed_18_cohort_relationships.csv",
              "scenario_ed_18_cohort_audit.csv",
          }
          for year in (2020, 2025):
              folder = Path(f"data/processed/ci_scenario_{year}")
              missing = sorted(name for name in expected if not (folder / name).exists())
              assert not missing, (year, missing)
              national = pd.read_csv(folder / "scenario_national_summary.csv").set_index("MILESTONE_YEAR")
              assert 2050 in national.index
              spared = float(national.loc[2050, "POTENTIAL_SPARED_GRASSLAND_HA"])
              assert spared > 0
              print(f"CLI_BOTH_30_FROM_{year}_2050_POTENTIAL_SPARED_GRASSLAND_HA={spared:.6f}")
          PY
