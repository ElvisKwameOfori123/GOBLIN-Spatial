name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin,scenario,reporting,query]"
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Verify repository-contained runtime inputs
        run: goblin-spatial fetch-data --verify-only

      - name: Guard against superseded land runtime
        run: pytest -q tests/test_no_superseded_runtime.py

      - name: Validate frozen 2020 soil and LPIS runtime context
        run: pytest -q tests/test_land_context_bundle.py

      - name: Run historical baseline unit tests
        run: |
          pytest -q \
            tests/test_baseline_contract.py \
            tests/test_cattle.py \
            tests/test_cattle_annual_age_sex.py \
            tests/test_cattle_annual_genetics.py \
            tests/test_cattle_annual_panel.py \
            tests/test_cattle_two_anchor.py \
            tests/test_cli_data_boundary.py \
            tests/test_cli_study.py \
            tests/test_data_fetch.py \
            tests/test_export_schema.py \
            tests/test_historical_validation.py \
            tests/test_input_data.py \
            tests/test_livestock_panels.py \
            tests/test_sheep_annual_panel.py \
            tests/test_sheep_10_cohorts.py \
            tests/test_standard_output.py

      - name: Run full 2015-2025 historical regression
        run: pytest -q -s tests/test_full_baseline_regression.py

      - name: Run reporting architecture guard
        run: pytest -q tests/test_reporting_boundary.py

      - name: Run catchment bridge unit tests
        run: pytest -q tests/test_catchment_bridge.py

      - name: Build canonical historical baseline
        run: goblin-spatial build --config configs/ireland_2015_2025.yaml

      - name: Run historical validation diagnostics
        run: python scripts/run_historical_validation.py

      - name: Run Code 2 two-anchor cattle diagnostics
        run: python scripts/run_cattle_code2_two_anchor_diagnostics.py

      - name: Run cattle genetics diagnostics
        run: python scripts/run_cattle_genetics_diagnostics.py

      - name: Confirm historical validation outputs
        run: |
          test -f data/processed/validation/historical/historical_validation_overview.csv
          test -f data/processed/validation/historical/dafm_county_sheep_diagnostics.csv
          test -f data/processed/validation/historical/sheep_composition_holdout_2022.csv
          test -f data/processed/validation/historical/achill_ed_2020_diagnostics.csv
          test -f data/processed/validation/historical/achill_land_2020_diagnostics.csv
          test -f data/processed/validation/historical/temporal_rank_stability.csv
          test -f data/processed/validation/historical/cattle_code2_two_anchor_vs_null.csv
          test -f data/processed/validation/historical/cattle_code2_county_closure.csv
          test -f data/processed/validation/historical/cattle_code2_national_totals.csv
          test -f data/processed/validation/historical/cattle_genetics_summary.csv
          test -f data/processed/validation/historical/cattle_genetics_ed_2020.csv
          test -f data/processed/validation/historical/cattle_genetics_national_margins.csv
          test -f data/processed/validation/historical/cattle_genetics_dafm_type_check_2020.csv
          python - <<'PY'
          import pandas as pd

          dafm = pd.read_csv("data/processed/validation/historical/dafm_county_sheep_diagnostics.csv")
          holdout = pd.read_csv("data/processed/validation/historical/sheep_composition_holdout_2022.csv")
          achill = pd.read_csv("data/processed/validation/historical/achill_ed_2020_diagnostics.csv")
          achill_land = pd.read_csv("data/processed/validation/historical/achill_land_2020_diagnostics.csv")
          stability = pd.read_csv("data/processed/validation/historical/temporal_rank_stability.csv")
          overview = pd.read_csv("data/processed/validation/historical/historical_validation_overview.csv")

          assert len(dafm) == 26 * 4
          assert set(dafm["YEAR"]) == {2015, 2020, 2022, 2025}
          assert dafm["County"].nunique() == 26
          assert len(holdout) == 26 * 3 * 4
          assert len(achill) == 23 * 4
          assert achill[["BENCHMARK_VALUE", "MODEL_VALUE", "ERROR"]].notna().all().all()
          assert len(achill_land) == 23 * 5
          assert achill_land[["BENCHMARK_VALUE", "MODEL_VALUE", "ERROR"]].notna().all().all()
          assert len(stability) == 10 * 7
          assert overview["VALUE"].notna().all()

          print(overview.to_string(index=False))
          PY

      - name: Build 2015-2025 WFD catchment baseline
        run: python scripts/build_catchment_baseline.py

      - name: Verify frozen WFD catchment geometry checksum
        run: |
          test -f data/inputs/spatial/WFD_Catchments_Frozen.gpkg
          test -f data/inputs/spatial/WFD_Catchments_Frozen.gpkg.sha256
          sha256sum -c data/inputs/spatial/WFD_Catchments_Frozen.gpkg.sha256

      - name: Upload frozen WFD catchment geometry
        uses: actions/upload-artifact@v4
        with:
          name: wfd-catchments-frozen
          path: |
            data/inputs/spatial/WFD_Catchments_Frozen.gpkg
            data/inputs/spatial/WFD_Catchments_Frozen.gpkg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Validate catchment baseline outputs
        run: |
          python - <<'PY'
          import pandas as pd

          wfd = pd.read_csv("data/processed/goblin_spatial_wfd_catchment_2015_2025.csv")
          colm = pd.read_csv("data/processed/goblin_spatial_colm_catchment_2015_2025.csv")
          county = pd.read_csv("data/processed/goblin_spatial_county_2015_2025.csv")
          national = pd.read_csv("data/processed/goblin_spatial_national_2015_2025.csv")
          crosswalk = pd.read_csv("data/processed/ed_wfd_catchment_crosswalk.csv")
          diagnostics = pd.read_csv("data/processed/catchment_closure_diagnostics.csv")

          assert wfd.groupby("YEAR")["WFD_CATCHMENT_ID"].nunique().eq(46).all()
          assert colm.groupby("YEAR")["COLM_CATCHMENT"].nunique().eq(37).all()
          assert county.groupby("YEAR")["County"].nunique().eq(26).all()
          assert len(national) == 11
          for frame in (wfd, colm, county, national):
              assert "AVERAGE_SIZE_OF_HOLDINGS" in frame
              assert "AVERAGE_AGE_OF_HOLDER" in frame
              assert "MEDIAN_AGE_OF_HOLDER" not in frame
          assert crosswalk.groupby("CSOED")["ED_CATCHMENT_WEIGHT"].sum().sub(1.0).abs().max() < 1e-10
          assert diagnostics["DIFF"].abs().max() < 1e-6

          print("WFD catchment-years:", len(wfd))
          print("Colm catchment-years:", len(colm))
          print("County-years:", len(county))
          print("National-years:", len(national))
          print("Crosswalk rows:", len(crosswalk))
          PY

      - name: Build historical manuscript result bundle
        run: python scripts/build_historical_results_bundle.py

      - name: Validate historical manuscript result bundle
        run: |
          test -f reporting/report_data/historical/ed_year.parquet
          test -f reporting/report_data/historical/county_year.parquet
          test -f reporting/report_data/historical/wfd_catchment_year.parquet
          test -f reporting/report_data/historical/national_year.parquet
          test -f reporting/report_data/historical/validation_summary.csv
          test -f reporting/report_data/historical/anchor_reconciliation_2020.csv
          test -f reporting/report_data/historical/so_change_2015_2025.csv
          test -f reporting/report_data/historical/matched_pairs_2020.csv
          test -f reporting/report_data/historical/stable_ed_sensitivity.csv
          test -f reporting/report_data/historical/multiscale_example_2020.csv
          test -f reporting/report_data/historical/historical_results.duckdb
          python - <<'PY'
          import duckdb
          from pathlib import Path

          db = Path("reporting/report_data/historical/historical_results.duckdb")
          con = duckdb.connect(str(db), read_only=True)
          assert con.sql("select count(*) from ed_year").fetchone()[0] == 31427
          assert con.sql("select count(distinct County) from county_year").fetchone()[0] == 26
          assert con.sql("select count(distinct WFD_CATCHMENT_ID) from wfd_catchment_year").fetchone()[0] == 46
          con.close()
          PY

      - name: Upload historical result bundle
        uses: actions/upload-artifact@v4
        with:
          name: goblin-spatial-historical-results
          path: reporting/report_data/historical/
          if-no-files-found: error
          retention-days: 30
