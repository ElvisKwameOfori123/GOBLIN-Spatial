name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin]"
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Verify Git-tracked and staged inputs
        run: goblin-spatial fetch-data --verify-only --tracked-only

      - name: Run historical baseline tests
        run: |
          pytest -q \
            tests/test_baseline_contract.py \
            tests/test_cattle.py \
            tests/test_data_fetch.py \
            tests/test_export_schema.py \
            tests/test_input_data.py \
            tests/test_standard_output.py

      # Scenario, 08B/08C, LPIS and released-land tests are deliberately not
      # collected in this workflow while the v1 historical baseline is being
      # migrated. They keep their own source files for the later scenario pass.
      - name: Detect complete historical baseline bundle
        id: full_data
        shell: bash
        run: |
          if [[ -f data/inputs/baseline/01_CSO_ED_Agricultural_Baseline_2020.csv \
             && -f data/inputs/baseline/01_CSO_AAA10_Cattle_County_2015_2025.csv \
             && -f data/inputs/baseline/03_CSO_AAA09_Sheep_County_Region_2015_2025.xlsx \
             && -f data/inputs/baseline/05A_DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.csv \
             && -f data/inputs/baseline/05C_Cattle_Cohort_Relationships_2012_2020.csv \
             && -f data/inputs/baseline/06_CSO_AQA06_Agricultural_Land_Use.xlsx \
             && -f data/inputs/baseline/06_Farm_Structure_Demographic_Controls.csv \
             && -f data/inputs/baseline/08_IFS2020_Standard_Output_Mapping.xlsx ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Canonical historical baseline inputs detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Canonical historical baseline inputs not yet committed; full regression will be skipped."
          fi

      - name: Run full 2015-2025 historical regression
        if: steps.full_data.outputs.available == 'true'
        run: pytest -q -s tests/test_full_baseline_regression.py
