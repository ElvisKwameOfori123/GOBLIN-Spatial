name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  baseline-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin]"
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Verify Git-tracked and staged inputs
        run: goblin-spatial fetch-data --verify-only --tracked-only

      - name: Run historical baseline contract tests
        run: pytest -q tests/test_baseline_contract.py

      - name: Run compact-data tests
        run: pytest -q -m "not full_data"

      # The historical baseline regression is intentionally independent of
      # 08B/08C soil, LPIS, ED geometry and SC1-SC3. Those belong downstream
      # of the Stage-09 baseline and will be tested when scenario refactoring
      # resumes.
      - name: Detect complete historical baseline bundle
        id: full_data
        shell: bash
        run: |
          if [[ -f data/raw/cattle/CSO_ED_2020.csv && -f data/raw/land/AQA06_Unpivoted_2013_2025.csv ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Historical baseline inputs detected."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Historical baseline inputs not present; full regression will be skipped."
          fi

      - name: Run full 2015-2025 historical regression
        if: steps.full_data.outputs.available == 'true'
        run: pytest -q -s -m full_data
