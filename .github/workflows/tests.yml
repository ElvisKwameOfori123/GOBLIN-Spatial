name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  historical-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,reporting,query]"
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Verify repository-contained inputs
        run: goblin-spatial fetch-data --verify-only

      - name: Run historical-baseline test suite
        run: pytest -q

      - name: Build complete historical release
        run: python scripts/build_historical_release.py

      - name: Confirm coherence audit and release products
        run: |
          test -f reporting/report_data/historical/historical_results.duckdb
          test -f reporting/report_data/historical/historical_results.sqlite
          test -f reporting/report_data/historical/ed_year.parquet
          test -f reporting/report_data/historical/county_year.parquet
          test -f reporting/report_data/historical/wfd_catchment_year.parquet
          test -f reporting/report_data/historical/livestock_signature.parquet
          test -f reporting/report_data/historical/parent_follower_relationship_ed.parquet
          test -f reporting/report_data/historical/utility_displacement.parquet
          python - <<'PY'
          import duckdb
          from pathlib import Path

          db = Path("reporting/report_data/historical/historical_results.duckdb")
          con = duckdb.connect(str(db), read_only=True)
          assert con.sql("select count(*) from ed_year").fetchone()[0] == 31427
          assert con.sql("select count(distinct County) from county_year").fetchone()[0] == 26
          assert con.sql("select count(distinct WFD_CATCHMENT_ID) from wfd_catchment_year").fetchone()[0] == 46
          assert con.sql("select count(*) from baseline_coherence_audit where not PASS").fetchone()[0] == 0
          assert con.sql("select count(*) from baseline_coherence_audit").fetchone()[0] == 46
          assert con.sql("select count(*) from livestock_signature where GEOGRAPHY_TYPE = 'ED'").fetchone()[0] == 2 * 2857
          assert con.sql("select count(distinct WFD_CATCHMENT_ID) from utility_comparison_wfd").fetchone()[0] == 46
          con.close()
          PY

      - name: Upload historical result bundle
        uses: actions/upload-artifact@v4
        with:
          name: goblin-spatial-historical-results
          path: reporting/report_data/historical/
          if-no-files-found: error
          retention-days: 30
