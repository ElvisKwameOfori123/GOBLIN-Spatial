name: graph-only results master

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/results-graphs-master.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: graph-only-results-master
  cancel-in-progress: true

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current plotting code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and workbook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin,scenario]" xlsxwriter pillow

      - name: Download frozen final-results artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen
          gh api repos/${{ github.repository }}/actions/artifacts/9741162790/zip > frozen/final-results.zip
          unzip -q frozen/final-results.zip -d frozen/results
          test -n "$(find frozen/results -name 'GOBLIN_Spatial_Final_Results.sqlite' -print -quit)"

      - name: Rebuild reproducible Python graphs from frozen SQLite
        run: |
          set -euo pipefail
          SQLITE=$(find frozen/results -name 'GOBLIN_Spatial_Final_Results.sqlite' -print -quit)
          mkdir -p output/graphs
          goblin-spatial-paper-figures "$SQLITE" --output-dir "$PWD/output/graphs"

      - name: Build compact Excel master directly from authoritative SQLite
        run: |
          python - <<'PY'
          from pathlib import Path
          import sqlite3
          import pandas as pd

          root = Path('frozen/results')
          sqlite_path = next(root.rglob('GOBLIN_Spatial_Final_Results.sqlite'))
          out = Path('output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx')
          out.parent.mkdir(parents=True, exist_ok=True)

          # Human-facing scientific result surfaces. Raw SC1/SC2/SC3 ED tables and map_data
          # remain in the frozen SQLite/matrix artifacts and are intentionally not duplicated here.
          wanted = [
              ('01_Scenario_Design', 'run_registry'),
              ('02_Headline_Results', 'headline_results'),
              ('03_National_Pathways', 'national_results'),
              ('04_SC1_Livestock', 'livestock'),
              ('05_SC1_Distribution', 'distribution_summary'),
              ('06_SC1_Protection', 'redistribution'),
              ('07_SC1_Persistence', 'persistence'),
              ('08_SC1_Robustness', 'robust_exposure'),
              ('09_SC1_Land_Release', 'land_release_summary'),
              ('10_SC2_Opportunity', 'opportunity_summary'),
              ('11_Transition_Conditions', 'transition_conditions'),
              ('12_Opportunity_Mobil', 'opportunity_mobilisation'),
              ('13_SC3_Target_Realised', 'sc3_national'),
              ('14_SC3_Shared_Pools', 'shared_pool_summary'),
              ('15_SC3_Rewetting', 'rewetting_summary'),
              ('16_SC3_Land_Accounting', 'land_accounting'),
              ('17_County_Results', 'county'),
              ('18_Figure_Data', 'figure_data'),
              ('19_Validation', 'validation'),
              ('20_Reconciliation', 'reconciliation'),
          ]

          with sqlite3.connect(sqlite_path) as con:
              available = {r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              tables = {}
              for sheet, table in wanted:
                  if table in available:
                      tables[sheet] = pd.read_sql_query(f'SELECT * FROM "{table}"', con)

          key_graphs = [
              'paper_fig01_national_transition.png',
              'paper_fig02_transition_concentration.png',
              'paper_fig03_protection_redistribution.png',
              'paper_fig05_released_land_composition.png',
              'paper_fig07_target_delivery.png',
          ]
          graph_dir = Path('output/graphs')

          with pd.ExcelWriter(out, engine='xlsxwriter', engine_kwargs={'options': {'strings_to_urls': False}}) as writer:
              wb = writer.book
              title_fmt = wb.add_format({'bold': True, 'font_size': 16})
              sub_fmt = wb.add_format({'font_size': 10, 'font_color': '#555555', 'text_wrap': True, 'valign': 'top'})
              hdr_fmt = wb.add_format({'bold': True, 'bg_color': '#E2F0D9', 'border': 1, 'text_wrap': True, 'valign': 'top'})
              note_fmt = wb.add_format({'text_wrap': True, 'valign': 'top'})

              read = wb.add_worksheet('00_Read_Me')
              writer.sheets['00_Read_Me'] = read
              read.hide_gridlines(2)
              read.set_column('A:A', 3)
              read.set_column('B:B', 28)
              read.set_column('C:N', 15)
              read.write('B2', 'GOBLIN-Spatial Results and Graphs Master', title_fmt)
              read.merge_range('B4:N5',
                  'Purpose: a compact human-facing Excel master containing the complete scientific result summaries and the reproducible Python graph suite. '
                  'Maps and map-data surfaces are intentionally excluded because cartography is being handled separately on the local desktop. '
                  'The frozen SQLite database and canonical 12-run artifact remain the lossless machine-readable sources.', sub_fmt)
              read.write('B7', 'Authoritative source', hdr_fmt)
              read.write('C7', 'Frozen successful final-results artifact from workflow run 33342717108', note_fmt)
              read.write('B8', 'Principal design', hdr_fmt)
              read.write('C8', '3 pathways × 4 implementation principles = 12 validated configurations', note_fmt)
              read.write('B9', 'Graph policy', hdr_fmt)
              read.write('C9', 'Graphs are regenerated in Python from the frozen SQLite results; no scientific values are hand-entered.', note_fmt)
              read.write('B10', 'Map policy', hdr_fmt)
              read.write('C10', 'No maps are embedded in this workbook.', note_fmt)

              # Key graph sheet first, immediately after Read Me.
              gs = wb.add_worksheet('01_Key_Graphs')
              writer.sheets['01_Key_Graphs'] = gs
              gs.hide_gridlines(2)
              gs.set_column('A:A', 3)
              gs.set_column('B:N', 14)
              gs.write('B2', 'Key reproducible scientific graphs', title_fmt)
              gs.merge_range('B3:N4',
                  'Selected high-information graphs only: national/economic exposure, concentration, protection redistribution, contested released land, and target delivery. '
                  'Supporting diagnostics remain in the result sheets.', sub_fmt)
              row = 6
              for i, name in enumerate(key_graphs, start=1):
                  png = graph_dir / name
                  if not png.exists():
                      continue
                  label = png.stem.replace('paper_fig', 'Graph ').replace('_', ' ').title()
                  gs.write(row, 1, label, hdr_fmt)
                  gs.insert_image(row + 1, 1, str(png), {'x_scale': 0.55, 'y_scale': 0.55})
                  row += 27

              for sheet, frame in tables.items():
                  frame.to_excel(writer, sheet_name=sheet, index=False, startrow=1)
                  ws = writer.sheets[sheet]
                  ws.hide_gridlines(2)
                  ws.freeze_panes(2, 0)
                  ws.autofilter(1, 0, max(1, len(frame)) + 1, max(0, len(frame.columns) - 1))
                  ws.set_row(1, 30)
                  for j, col in enumerate(frame.columns):
                      ws.write(1, j, col, hdr_fmt)
                      # Conservative readable widths; do not make very wide sheets unwieldy.
                      sample = frame[col].astype(str).head(250) if len(frame) else pd.Series(dtype=str)
                      width = min(28, max(10, len(str(col)) + 2, int(sample.str.len().quantile(0.9)) + 2 if len(sample) else 10))
                      ws.set_column(j, j, width)

          print(out)
          print('Workbook sheets:', ['00_Read_Me', '01_Key_Graphs', *tables.keys()])
          PY

      - name: Confirm workbook
        run: |
          set -euo pipefail
          test -f output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx
          ls -lh output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx
          ls -lh output/graphs/*.png

      - name: Upload Excel master
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-results-and-graphs-master
          path: output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone graphs
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-python-graphs
          path: output/graphs
          if-no-files-found: error
          retention-days: 30
