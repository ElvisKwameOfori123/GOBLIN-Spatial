name: graph-only results master

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/results-graphs-master.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-master:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current plotting code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and workbook dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[geo,goblin,scenario]" openpyxl pillow

      - name: Download frozen final-results artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p frozen
          gh api repos/${{ github.repository }}/actions/artifacts/9741162790/zip > frozen/final-results.zip
          unzip -q frozen/final-results.zip -d frozen/results
          find frozen/results -maxdepth 3 -type f | sort | head -100

      - name: Rebuild current reproducible graphs from frozen SQLite
        run: |
          set -euo pipefail
          SQLITE=$(find frozen/results -name 'GOBLIN_Spatial_Final_Results.sqlite' -print -quit)
          test -n "$SQLITE"
          mkdir -p output/graphs
          goblin-spatial-paper-figures "$SQLITE" --output-dir "$PWD/output/graphs"

      - name: Build Excel master with all results and graphs only
        run: |
          python - <<'PY'
          from pathlib import Path
          from copy import copy
          from openpyxl import load_workbook
          from openpyxl.drawing.image import Image
          from openpyxl.styles import Font, PatternFill, Alignment

          root = Path('frozen/results')
          source = next(root.rglob('GOBLIN_Spatial_Final_Results_Master.xlsx'))
          out = Path('output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx')
          out.parent.mkdir(parents=True, exist_ok=True)

          wb = load_workbook(source)

          # Remove map-specific and legacy figure surfaces. All numerical result sheets remain.
          for name in ['18_Map_Data', '23_Figures']:
              if name in wb.sheetnames:
                  del wb[name]

          # Keep figure data because it is the reproducible numeric source for graphs.
          if '18_Graphs' in wb.sheetnames:
              del wb['18_Graphs']
          ws = wb.create_sheet('18_Graphs')
          ws.sheet_view.showGridLines = False
          ws.column_dimensions['A'].width = 3
          for col in 'BCDEFGHIJKLMN':
              ws.column_dimensions[col].width = 13

          ws['B2'] = 'GOBLIN-Spatial: reproducible scientific graphs'
          ws['B2'].font = Font(size=16, bold=True)
          ws['B3'] = ('All graphs are regenerated in Python from the frozen final-results SQLite database. '
                      'Maps are intentionally excluded from this Excel master and remain a separate local cartographic output.')
          ws['B3'].alignment = Alignment(wrap_text=True, vertical='top')
          ws.merge_cells('B3:N4')

          graph_dir = Path('output/graphs')
          pngs = sorted(graph_dir.glob('*.png'))
          row = 6
          for i, png in enumerate(pngs, start=1):
              title = png.stem.replace('_', ' ').title()
              ws.cell(row=row, column=2, value=f'Graph {i}. {title}')
              ws.cell(row=row, column=2).font = Font(size=12, bold=True)
              img = Image(str(png))
              max_width = 1050
              if img.width > max_width:
                  scale = max_width / img.width
                  img.width = int(img.width * scale)
                  img.height = int(img.height * scale)
              ws.add_image(img, f'B{row+1}')
              # generous vertical spacing so each graph reads as a standalone publication panel
              row += max(30, int(img.height / 20) + 5)

          # Move graph sheet immediately after headline results for easy use.
          wb._sheets.remove(ws)
          insert_at = min(3, len(wb._sheets))
          wb._sheets.insert(insert_at, ws)

          # Update Read Me if present.
          if '00_Read_Me' in wb.sheetnames:
              readme = wb['00_Read_Me']
              last = readme.max_row + 2
              readme.cell(last, 1, 'GRAPH-ONLY MASTER')
              readme.cell(last, 1).font = Font(bold=True)
              readme.cell(last + 1, 1,
                          'This workbook retains all human-facing numerical result tables and the reproducible Python graph suite. '
                          'Map data and embedded maps are intentionally excluded; spatial maps are maintained separately for local cartographic work.')

          wb.save(out)
          print(out)
          print('Sheets:')
          for s in wb.sheetnames:
              print(' -', s)
          PY

      - name: Confirm workbook
        run: |
          test -f output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx
          ls -lh output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx output/graphs/*

      - name: Upload Excel master
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-results-and-graphs-master
          path: output/GOBLIN_Spatial_Results_and_Graphs_Master.xlsx
          if-no-files-found: error
          retention-days: 30

      - name: Upload standalone graphs
        uses: actions/upload-artifact@v4
        with:
          name: GOBLIN-Spatial-python-graphs
          path: output/graphs
          if-no-files-found: error
          retention-days: 30
