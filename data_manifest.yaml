manifest_version: "0.4.0"
release: "ireland-2015-2025-dev"
status: "development"

# Development rule:
# - the complete Ireland 2015-2025 baseline input bundle is currently
#   versioned directly in GitHub for simple, reproducible development;
# - SHA256 checksums pin the principal full-data inputs;
# - large/raw GIS sources are declared as external inputs and kept out of
#   ordinary Git history; their exact local copies are pinned by SHA256;
# - before a public v1.0 release, large/raw source files can be moved to
#   Zenodo or official download endpoints without changing scientific logic.

datasets:
  cso_ed_2020:
    module: [cattle, land, se]
    description: "Fixed 2020 CSO Electoral Division agricultural baseline."
    source: "git"
    path: "data/raw/cattle/CSO_ED_2020.csv"
    git_tracked: true
    sha256: "bc93d1f9747809aed79ea7e7160f5853265d73e5056cceaae0353ee2fc63a657"
    required: true

  cso_cattle_county_2015_2025:
    module: [cattle]
    description: "Annual CSO county cattle controls for 2015-2025."
    source: "git"
    path: "data/raw/cattle/CSO_county_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_county_2015_2025:
    module: [sheep]
    description: "County sheep controls used by the validated hierarchy."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_County_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_region_2015_2025:
    module: [sheep]
    description: "Regional sheep controls used by the validated hierarchy."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_Region_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_source_workbook:
    module: [sheep]
    description: "Combined county and region sheep source/audit workbook."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_County_and_Region_WIDE_2015_2025.xlsx"
    git_tracked: true
    required: false

  dafm_sheep_breed_anchors:
    module: [sheep]
    description: "DAFM county sheep breed-composition anchors for 2016, 2020, 2022 and 2025."
    source: "git"
    path: "data/raw/sheep/DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.zip"
    git_tracked: true
    required: true
    note: "The annual 2015-2025 composition table is generated by the sheep module from these anchors."

  cso_land_aqa06_2013_2025:
    module: [land]
    description: "AQA06 annual regional land-use controls in tidy form."
    source: "git"
    path: "data/raw/land/AQA06_Unpivoted_2013_2025.csv"
    git_tracked: true
    sha256: "873de22c6215847d4a39654c62ac9aff77e96c195dcfedd6609222a4d7124545"
    required: true
    note: "Generated directly from the AQA06 Unpivoted sheet; row ordering does not affect the land algorithm."

  goblin_cohort_relationships:
    module: [cattle, sheep]
    description: "GOBLIN cohort relationships used for biological disaggregation."
    source: "git"
    path: "data/controls/cohort2012-2020.csv"
    git_tracked: true
    required: true

  se_controls:
    module: [se]
    description: "Official structural and holder-age controls used by the SE module."
    source: "git"
    path: "data/controls/06_SE_Data_Controls.csv"
    git_tracked: true
    required: true

  county_region_map:
    module: [sheep, land]
    description: "Irish county-to-region mapping used by hierarchical reconciliation."
    source: "git"
    path: "data/controls/county_region_map.csv"
    git_tracked: true
    required: true

  saps_ed_geography:
    module: [soil, spatial]
    description: "CSO SAPS Electoral Division geometry carrying the CSOED coding system used to spatially locate the authoritative GOBLIN-Spatial baseline."
    source: "external"
    destination: "data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.shp"
    sha256: "0fefea2da017afb25dccafe3c51dbfb7ecdf2dff7ce7e00ae91ce5ee600102df"
    required: false
    note: "The matching .shx, .dbf and .prj sidecars must sit beside the .shp. The full SAPS layer has 3,409 EDs; the livestock baseline remains authoritative and currently selects 2,857 production EDs."

  sis_national_soils_zip:
    module: [soil, spatial]
    description: "Teagasc Irish Soil Information System national 1:250,000 soil-association map bundle."
    source: "external"
    destination: "data/external/spatial/sis_soils/INSM250k_ING_1b.zip"
    sha256: "7c2eaa206335d6c34a02bfd008567375cd4b5128b83f88635c58a5be3cc6a35b"
    required: false
    note: "Extract in place before overlay. The contained INSM250k_ING.shp is larger than GitHub's normal per-file limit, so the raw bundle is intentionally not committed."

  lpis_2020_audit:
    module: [soil, land, spatial]
    description: "LPIS 2020 audit workbook retained for the later agricultural-grassland mask and denominator validation stage."
    source: "external"
    destination: "data/external/spatial/lpis/LPIS_2020_audit.xlsx"
    sha256: "a2bc952ddc922982cf0a23e4f91dacc54bbce44a1d6e0af84f675694287ab1a5"
    required: false
    note: "This audit workbook is contextual input only until a validated parcel/grassland geometry workflow is defined."
