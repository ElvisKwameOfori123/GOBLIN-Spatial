manifest_version: "0.2.2"
release: "ireland-2015-2025-dev"
status: "development"

# During development the core working inputs are versioned directly in GitHub.
# The Git commit itself pins the exact bytes. If these files later move to
# Zenodo/official URLs, checksums can be added without changing the scientific
# module API.

datasets:
  cso_ed_2020:
    module: [cattle, land, se]
    description: "Fixed 2020 CSO Electoral Division agricultural baseline."
    source: "git"
    path: "data/raw/cattle/CSO_ED_2020.csv.xz"
    git_tracked: true
    required: true

  cso_cattle_county_2015_2025:
    module: [cattle]
    description: "Annual CSO county cattle controls for 2015-2025."
    source: "git"
    path: "data/raw/cattle/CSO_county_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_county_2015_2025:
    module: [sheep]
    description: "County sheep controls used by the validated hierarchy."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_County_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_region_2015_2025:
    module: [sheep]
    description: "Regional sheep controls used by the validated hierarchy."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_Region_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_source_workbook:
    module: [sheep]
    description: "Combined county and region sheep source/audit workbook."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_County_and_Region_WIDE_2015_2025.xlsx"
    git_tracked: true
    required: false

  dafm_sheep_breed_anchors:
    module: [sheep]
    description: "DAFM county sheep breed-composition anchors for 2016, 2020, 2022 and 2025."
    source: "git"
    path: "data/raw/sheep/DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.zip"
    git_tracked: true
    required: true
    note: "The annual 2015-2025 composition table is generated by the sheep module from these anchors; it is not a separate raw input."

  cso_land_aqa06_2013_2025:
    module: [land]
    description: "AQA06 annual regional land-use controls in tidy form."
    source: "git"
    path: "data/raw/land/AQA06_Unpivoted_2013_2025.csv.xz"
    git_tracked: true
    required: true

  goblin_cohort_relationships:
    module: [cattle, sheep]
    description: "GOBLIN cohort relationships used for biological disaggregation."
    source: "git"
    path: "data/controls/cohort2012-2020.csv"
    git_tracked: true
    required: true

  se_controls:
    module: [se]
    description: "Official structural and holder-age controls used by the SE module."
    source: "git"
    path: "data/controls/06_SE_Data_Controls.csv"
    git_tracked: true
    required: true

  county_region_map:
    module: [sheep, land]
    description: "Irish county-to-region mapping used by hierarchical reconciliation."
    source: "git"
    path: "data/controls/county_region_map.csv"
    git_tracked: true
    required: true
