manifest_version: "0.7.0"
release: "ireland-2015-2025-dev"
status: "development"

# Data architecture:
# - compact validated controls remain versioned directly in Git;
# - holding-linked source microdata are external and are collapsed to ED controls;
# - large/raw GIS inputs are stored externally and fetched on demand;
# - the published GOBLIN-Spatial spatial bundle is pinned to an immutable,
#   version-specific Zenodo record for exact reproducibility;
# - the Zenodo concept DOI is also recorded for citation/discovery of future
#   versions, but model execution uses the version-specific record below.

external_releases:
  goblin_spatial_spatial_inputs_v0_1_0:
    repository: "Zenodo"
    record_id: 21906755
    version_doi: "10.5281/zenodo.21906755"
    concept_doi: "10.5281/zenodo.21906754"
    title: "GOBLIN-Spatial Frozen Spatial Input Bundle for Irish Electoral Division and Soil Analysis, Version 0.1.0"
    publication_date: "2026-08-12"
    license: "CC-BY-4.0"

datasets:
  cso_ed_2020:
    module: [cattle, land, se]
    description: "Fixed 2020 CSO Electoral Division agricultural baseline."
    source: "git"
    path: "data/raw/cattle/CSO_ED_2020.csv"
    git_tracked: true
    sha256: "bc93d1f9747809aed79ea7e7160f5853265d73e5056cceaae0353ee2fc63a657"
    required: true

  cso_cattle_county_2015_2025:
    module: [cattle]
    description: "Annual CSO county cattle controls for 2015-2025."
    source: "git"
    path: "data/raw/cattle/CSO_county_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_county_2015_2025:
    module: [sheep]
    description: "County sheep controls used by the validated hierarchy."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_County_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_region_2015_2025:
    module: [sheep]
    description: "Regional sheep controls used by the validated hierarchy."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_Region_WIDE_2015_2025.csv.xz"
    git_tracked: true
    required: true

  cso_sheep_source_workbook:
    module: [sheep]
    description: "Combined county and region sheep source/audit workbook."
    source: "git"
    path: "data/raw/sheep/CSO_Sheep_County_and_Region_WIDE_2015_2025.xlsx"
    git_tracked: true
    required: false

  dafm_sheep_breed_anchors:
    module: [sheep]
    description: "DAFM county sheep breed-composition anchors for 2016, 2020, 2022 and 2025."
    source: "git"
    path: "data/raw/sheep/DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.zip"
    git_tracked: true
    required: true
    note: "The annual 2015-2025 composition table is generated by the sheep module from these anchors."

  cso_land_aqa06_2013_2025:
    module: [land]
    description: "AQA06 annual regional land-use controls in tidy form."
    source: "git"
    path: "data/raw/land/AQA06_Unpivoted_2013_2025.csv"
    git_tracked: true
    sha256: "873de22c6215847d4a39654c62ac9aff77e96c195dcfedd6609222a4d7124545"
    required: true
    note: "Generated directly from the AQA06 Unpivoted sheet; row ordering does not affect the land algorithm."

  goblin_cohort_relationships:
    module: [cattle, sheep]
    description: "GOBLIN cohort relationships used for biological disaggregation."
    source: "git"
    path: "data/controls/cohort2012-2020.csv"
    git_tracked: true
    required: true

  goblin_pasture_dm_2020_fixed:
    module: [scenario, pressure, land]
    description: "Frozen 31-cohort GOBLIN pasture dry-matter requirements used by the cattle-only population-reduction study under fixed 2020 feed/management parameters."
    source: "git"
    path: "data/controls/pasture/GOBLIN_pasture_dm_2020_fixed.csv"
    git_tracked: true
    sha256: "084fc151e40fc7f499f62932da6181802f3b124c30c5427b88346581fa454d8f"
    required: true
    note: "Derived and parity-tested against pinned public packages livestock_generation 0.2.2, cattle_lca 0.3.1 and sheep_lca 0.3.1. This is a fixed-2020 per-head feed parameterisation reused at future milestones in the principal cattle-population-only scenario; year/scenario-specific GOBLIN controls should replace it when feed or productivity management changes."

  se_controls:
    module: [se]
    description: "Official structural and holder-age controls used by the SE module."
    source: "git"
    path: "data/controls/06_SE_Data_Controls.csv"
    git_tracked: true
    required: true

  county_region_map:
    module: [sheep, land]
    description: "Irish county-to-region mapping used by hierarchical reconciliation."
    source: "git"
    path: "data/controls/county_region_map.csv"
    git_tracked: true
    required: true

  cathal_agricultural_soils:
    module: [soil, land]
    description: "Cathal/NFS holding-linked agricultural soil and forestry-context source used only to derive ED-level shares."
    source: "external"
    destination: "data/external/soil/cathal.csv"
    sha256: "4af6018a8860380aa0f45ba6acc47e9d894e27ec93975ea29eb2dfb4dc21c1dc"
    required: false
    note: "Raw holding rows and herd identifiers are never merged into GOBLIN-Spatial outputs. cso_ed locates the source record, fsizuaa supplies the area weight, and soil_code_nfs supplies agricultural use-range class."

  ed_agricultural_soil_profile:
    module: [soil, land]
    description: "Compact ED-level GOBLIN production-soil and forestry-context profile generated from the Cathal/NFS source."
    source: "external"
    destination: "data/controls/soil/ED_GOBLIN_soil_profile.csv.xz"
    required: false
    note: "Generated locally by scripts/build_ed_agricultural_soil_profile.py rather than downloaded. Agricultural use-range classes 1-2 map to GOBLIN soil Group 1, classes 3-4 to Group 2, and classes 5-6 to Group 3. Source UAA weights shares; validated ALL_GRASSLAND remains the authoritative ED hectare total. Forest Yield Class and Irish Forest Soil fields are retained only as downstream opportunity context."

  saps_ed_geography:
    module: [soil, spatial]
    description: "CSO SAPS Electoral Division geometry carrying the CSOED coding system used to spatially locate the authoritative GOBLIN-Spatial baseline."
    source: "zenodo"
    release: "goblin_spatial_spatial_inputs_v0_1_0"
    destination: "data/external/spatial/ed/Electoral_Divisions.zip"
    url: "https://zenodo.org/records/21906755/files/Electoral_Divisions.zip?download=1"
    known_hash: "md5:bc4b752a1b518913e7ea18ed09ac3ae0"
    archive: "zip"
    extract_to: "data/external/spatial/ed"
    primary_path: "data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.shp"
    primary_sha256: "0fefea2da017afb25dccafe3c51dbfb7ecdf2dff7ce7e00ae91ce5ee600102df"
    required_members:
      - "data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.shp"
      - "data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.shx"
      - "data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.dbf"
      - "data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.prj"
    member_sha256:
      shp: "0fefea2da017afb25dccafe3c51dbfb7ecdf2dff7ce7e00ae91ce5ee600102df"
      shx: "b40af1176ea8cc602e30c908211cc93da5c26b3c39be3d1fc3a8dcd0aa2f0bea"
      dbf: "679b675766419688141644dec2dafee8b3cb4b928f1258c7c0c32343675022dd"
      prj: "4df6798dbe12d22a1edd15991de2cae2cb4a6a1d79bf2b18319c352736a2f25f"
    required: false
    note: "Zenodo version DOI 10.5281/zenodo.21906755. The full SAPS layer has 3,409 geometries; the authoritative livestock baseline selects the 2,857 EDs used by GOBLIN-Spatial."

  sis_national_soils_zip:
    module: [soil, spatial]
    description: "Teagasc/EPA Irish Soil Information System national 1:250,000 soil-association map bundle retained for optional spatial validation and later opportunity refinement."
    source: "zenodo"
    release: "goblin_spatial_spatial_inputs_v0_1_0"
    destination: "data/external/spatial/sis_soils/INSM250k_ING_1b.zip"
    url: "https://zenodo.org/records/21906755/files/INSM250k_ING_1b.zip?download=1"
    known_hash: "sha256:7c2eaa206335d6c34a02bfd008567375cd4b5128b83f88635c58a5be3cc6a35b"
    zenodo_md5: "04a56bcad4b6aa5a38275b5719371194"
    archive: "zip"
    extract_to: "data/external/spatial/sis_soils"
    primary_path: "data/external/spatial/sis_soils/INSM250k_ING.shp"
    primary_sha256: "e628c26cca1f4ae609b554085b28b83a84aa025ddb60f0dae85b1f4c1063ba99"
    required_members:
      - "data/external/spatial/sis_soils/INSM250k_ING.shp"
      - "data/external/spatial/sis_soils/INSM250k_ING.shx"
      - "data/external/spatial/sis_soils/INSM250k_ING.dbf"
      - "data/external/spatial/sis_soils/INSM250k_ING.prj"
    member_sha256:
      shp: "e628c26cca1f4ae609b554085b28b83a84aa025ddb60f0dae85b1f4c1063ba99"
      shx: "31c13fb670729e19d98dca4392c4150ee7b62da78f6418443947cc95189ec2aa"
      dbf: "00a5b137bc8ed7653ab67fb63a7e94fb6343de204433a3ca70aeaa21737ceb0f"
      prj: "4df6798dbe12d22a1edd15991de2cae2cb4a6a1d79bf2b18319c352736a2f25f"
    required: false
    note: "Zenodo version DOI 10.5281/zenodo.21906755. SIS is not required for the principal GOBLIN production-soil calculation; it remains available for validation and later spatial land-opportunity analysis."

  lpis_2020_audit:
    module: [soil, land, spatial]
    description: "LPIS 2020 audit workbook retained for later parcel/grassland validation and high-resolution opportunity work."
    source: "external"
    destination: "data/external/spatial/lpis/LPIS_2020_audit.xlsx"
    sha256: "a2bc952ddc922982cf0a23e4f91dacc54bbce44a1d6e0af84f675694287ab1a5"
    required: false
    note: "Not redistributed through the Zenodo v0.1.0 spatial bundle. It is not required for the principal ED production-soil profile."
