manifest_version: "1.0.0"
release: "ireland-2015-2025-v1"
status: "scenario-finalization"

# GOBLIN-Spatial data contract
# ----------------------------
# A normal clone contains every compact input required to build the validated
# historical baseline and run the 2020 principal SC1 -> SC2 -> SC3 chain.
# The runtime data contract is repository-contained. No external data service is
# used by the model. First-principles reconstruction, if ever required, is a
# separate local/manual provenance activity using user-supplied source files.

datasets:
  cso_ed_agricultural_baseline_2020:
    stage: "01"
    module: [baseline, cattle, sheep, land_farm_structure]
    description: "2020 CSO Electoral Division agricultural baseline and fine-scale spatial anchor."
    source: "git"
    path: "data/inputs/baseline/01_CSO_ED_Agricultural_Baseline_2020.csv"
    sha256: "bc93d1f9747809aed79ea7e7160f5853265d73e5056cceaae0353ee2fc63a657"
    required: true

  cso_aaa10_cattle_county_2015_2025:
    stage: "01"
    module: [baseline, cattle]
    description: "CSO AAA10 annual county cattle controls for 2015-2025."
    source: "git"
    path: "data/inputs/baseline/01_CSO_AAA10_Cattle_County_2015_2025.csv"
    sha256: "4df4e3c7dcf7f3183cec422b55da627249c62fc061851132d30ad95c902bcbf7"
    required: true

  cso_aaa09_sheep_county_region_2015_2025:
    stage: "03A"
    module: [baseline, sheep]
    description: "Combined sheep workbook: County_WIDE supplies county-region crosswalk; Region_WIDE supplies raw AAA09 detailed-region controls."
    source: "git"
    path: "data/inputs/baseline/03_CSO_AAA09_Sheep_County_Region_2015_2025.xlsx"
    sha256: "64d4f36639090a62b95b4cae69fdade6a171f63a7008fb2c8dff02c3ec12dd11"
    required: true

  dafm_sheep_county_totals_2015_2020_2022_2025:
    stage: "VALIDATION"
    module: [validation, sheep]
    description: "DAFM county sheep totals retained for independent validation; not a production sheep population control."
    source: "git"
    path: "data/inputs/baseline/03_0_DAFM_Sheep_County_Totals_2015_2020_2022_2025.csv"
    sha256: "6d3ce31092328f18587530561ab440d91fa65e94c629ac5ca25e15bb4b042de2"
    required: false
    note: "Production sheep totals remain controlled by the CSO 2020 ED anchor and AAA09 regional hierarchy."

  dafm_sheep_breed_anchors:
    stage: "05A"
    module: [baseline, sheep]
    description: "DAFM county sheep breed-composition anchors for 2016, 2020, 2022 and 2025."
    source: "git"
    path: "data/inputs/baseline/05A_DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.csv"
    sha256: "c245df824279728e2b8c016cfc79c4232a0afbbb1ba6fd75cec171900aeeb702"
    required: true
    note: "DAFM controls composition only and does not replace the CSO/AAA09 sheep population."

  goblin_cohort_relationships:
    stage: "05C/05D"
    module: [baseline, cattle, sheep, signatures]
    description: "Shared GOBLIN livestock biological relationship source used for cattle and sheep cohort disaggregation."
    source: "git"
    path: "data/inputs/baseline/05C_Cattle_Cohort_Relationships_2012_2020.csv"
    sha256: "7c9f8c38a4eb53b11631d92fb0e9ccf37fc130a83ebd6d6d17b04e5f8de5232e"
    required: true
    note: "Published filename is retained although the source contains both cattle and sheep cohort series."

  cso_aqa06_agricultural_land_use:
    stage: "06"
    module: [baseline, land_farm_structure]
    description: "CSO AQA06 agricultural land-use controls used for crop and land reconstruction."
    source: "git"
    path: "data/inputs/baseline/06_CSO_AQA06_Agricultural_Land_Use.xlsx"
    sha256: "819b641f5347740e05468abe1650c48f6e7ae9c884f77b84beeeae436e16d343"
    required: true

  farm_structure_demographic_controls:
    stage: "06"
    module: [baseline, land_farm_structure]
    description: "Farm structure and holder-demographic controls used by the historical reconstruction."
    source: "git"
    path: "data/inputs/baseline/06_Farm_Structure_Demographic_Controls.csv"
    sha256: "cdfaec77532ea7630886195b060d63e94cf732d6543a153513e948eeb9766a4c"
    required: true

  ifs2020_standard_output_mapping:
    stage: "08"
    module: [baseline, standard_output]
    description: "IFS-2020 Standard Output mapping used for fixed-2020 production-value exposure."
    source: "git"
    path: "data/inputs/baseline/08_IFS2020_Standard_Output_Mapping.xlsx"
    sha256: "73196c3e4f26f31efdb527ded76ca5e016b2e6a128f8531be6260cae9429be88"
    required: true

  standard_output_coefficients:
    stage: "08"
    module: [baseline, standard_output, scenario]
    description: "Fixed 2020 Irish Standard Output coefficient control used for production-value exposure."
    source: "git"
    path: "data/controls/standard_output/IFS_SOC2020_IE_model_controls.csv"
    required: true

  goblin_scenario_controls:
    stage: "SC1/SC3"
    module: [scenario, sc1, sc3]
    description: "Editable national GOBLIN livestock-land endpoints and alternative land-use targets."
    source: "git"
    path: "data/controls/scenario/GOBLIN_Scenario_Controls.csv"
    sha256: "ce0a03982de16213bd81f28e3c94664dd105b604c67365003f1bea5423fcc95d"
    required: true
    note: "Runtime gross release is selected-year sum(ALL_GRASSLAND) minus TARGET_LIVESTOCK_LAND_HA."

  pasture_dm_controls:
    stage: "SC1"
    module: [scenario, sc1, land_release]
    description: "Fixed 2020 GOBLIN 31-cohort pasture dry-matter control used for spatial pressure accounting."
    source: "git"
    path: "data/controls/pasture/GOBLIN_pasture_dm_2020_fixed.csv"
    required: true

  ed_land_context_2020:
    stage: "08B/08C/SC2"
    module: [scenario, sc1, sc2, sc3]
    description: "Authoritative compact 2,857-ED 2020 spatial runtime bundle: 08B agricultural capability, independent 08C mapped physical soil and neutral LPIS 2020 context."
    source: "git"
    path: "data/controls/land/ED_Land_Context_2020"
    required: true
    expected_rows: 2857
    expected_columns: 40
    logical_sha256: "6a94c125413260ed462c9d5430fe6d39be7df48d282734eea218351829aa6e5d"
    bundle_manifest: "data/controls/land/ED_Land_Context_2020/manifest.json"
    component_files:
      08B:
        path: "data/controls/land/ED_Land_Context_2020/ED_Soil_Capability_08B.csv"
        sha256: "55014e27c872666cffaf2b876eaa856eccbab1e915513a2f91780177b0b0c2c4"
      08C:
        path: "data/controls/land/ED_Land_Context_2020/ED_Physical_Soil_08C.csv"
        sha256: "9892059c3f67c92d04427ad48220aa7565325df0251be6d53090388046b6bae4"
      LPIS_2020:
        path: "data/controls/land/ED_Land_Context_2020/ED_LPIS_Context_2020_RUNTIME.csv"
        sha256: "c8a6b66c9166ea3da0121def6225698037951d3022af02e5b42f2b54f4f13b2b"
    note: "The runtime loader verifies the three original compact CSVs, joins their identical ED universes in memory and enforces the 40-field scientific contract. SC1 uses only 08B fields; LPIS and 08C enter only after SC1 is frozen."

# Generated Stage 01-09 and SC1-SC3 outputs are not mandatory inputs.
