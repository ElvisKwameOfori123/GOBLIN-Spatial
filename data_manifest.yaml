manifest_version: "0.9.0"
release: "ireland-2015-2025-dev"
status: "development"

# GOBLIN-Spatial v1 data strategy
# -------------------------------
# Compact baseline and scenario-control inputs are intended to live directly
# in GitHub under data/inputs/. Large spatial inputs are fetched from the
# immutable Zenodo version DOI below and verified with SHA256 checksums.
#
# IMPORTANT MIGRATION RULE:
# The canonical v1 paths below are the target contract. During migration,
# scientific modules are switched to these paths only when the corresponding
# file has been physically placed and regression-tested. Generated stage outputs
# are not mandatory inputs.

external_releases:
  goblin_spatial_frozen_inputs_v1:
    repository: "Zenodo"
    record_id: 22035538
    version_doi: "10.5281/zenodo.22035538"
    concept_doi: "10.5281/zenodo.22035537"
    title: "GOBLIN-Spatial Frozen Model Inputs for Irish Electoral Division Agricultural and Land-Transition Modelling, Version 1.0.0"
    publication_date: "2026-08-20"
    license: "CC-BY-4.0"

# Canonical v1 input contract.
# git_pending means the file is intended to be committed directly to GitHub
# but the package path migration is not complete yet.

datasets:
