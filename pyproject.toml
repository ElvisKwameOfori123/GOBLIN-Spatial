[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-spatial"
version = "0.1.0"
description = "Constraint-preserving spatialisation of national GOBLIN livestock and land-use pathways to Electoral Division level."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Elvis Kwame Ofori"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "PyYAML>=6.0",
  "pooch>=1.8"
]

[project.optional-dependencies]
# GIS dependencies are optional because the reconstructed ED baseline can be
# used without raw polygon data. Install this extra for ED/SIS/LPIS overlays.
geo = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyogrio>=0.7",
  "pyarrow>=14"
]

goblin = [
  "cattle_lca==0.3.1",
  "sheep_lca==0.3.1",
  "livestock_generation==0.2.2",
  "grassland_production==0.3.6",
  "landcover_assignment==0.4.0"
]

[project.scripts]
goblin-spatial = "goblin_spatial.cli:main"
goblin-spatial-opportunity = "goblin_spatial.opportunity_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "full_data: integration tests requiring the external 2020 ED baseline and/or AQA06 full-data inputs",
]
