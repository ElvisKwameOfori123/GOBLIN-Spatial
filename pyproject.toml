[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goblin-spatial"
version = "1.0.0"
description = "Constraint-preserving spatial foresight for national GOBLIN livestock and land-use pathways at Electoral Division level."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Elvis Kwame Ofori"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "PyYAML>=6.0"
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0", "pyogrio>=0.7", "pyarrow>=14"]
scenario = ["scipy>=1.10"]
goblin = [
  "cattle_lca==0.3.1",
  "sheep_lca==0.3.1",
  "livestock_generation==0.2.2",
  "grassland_production==0.3.6",
  "landcover_assignment==0.4.0"
]

[project.scripts]
goblin-spatial = "goblin_spatial.cli:main"
goblin-spatial-principal = "goblin_spatial.principal_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["full_data: integration tests requiring the repository historical input bundle"]
