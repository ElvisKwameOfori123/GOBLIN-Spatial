study:
  name: Ireland ED baseline
  country: Ireland
  spatial_unit: Electoral Division
  start_year: 2015
  end_year: 2025
  base_year: 2020
  expected_eds: 2857

cattle:
  # Preferred historical reconstruction; use fixed_2020 only for the documented null sensitivity.
  spatial_weights: two_anchor_2010_2020
  # DAFM/AIM shifts only under-1 vs 1-2 odds; CSO/AAA10 margins stay exact.
  age_sex_prior: dafm_log_odds
  dafm_logit_epsilon: 1.0e-6
  # AIM ED type signal -> county fallback -> GOBLIN biological margins.
  genetics_prior: aim_hierarchical
  # National DxD/DxB/BxB expectations use AAA10 June cows in every year, including 2020.
  genetic_cow_denominator: aaa10

paths:
  raw: data/raw
  controls: data/controls
  interim: data/interim
  processed: data/processed

files:
  # Raw CSO AVA42 ED livestock table (2000, 2010, 2020). Stage 00
  # (scripts/prepare_census_inputs.py) fills its suppressed cells and writes
  # the two prepared census inputs below; the model never reads it directly.
  cso_ava42_ed_livestock: data/inputs/baseline/00_CSO_AVA42_Livestock_ED_2000_2010_2020.csv
  cso_ed_2010: data/inputs/baseline/CSO_ED2010.csv
  cso_ed_2020: data/inputs/baseline/01_CSO_ED_Agricultural_Baseline_2020.csv
  cso_cattle_county: data/inputs/baseline/01_CSO_AAA10_Cattle_County_2015_2025.csv
  dafm_aim_ed_cattle_profile_2020: data/inputs/baseline/02_DAFM_AIM_ED_Cattle_Profile_2020.csv
  cso_sheep_workbook: data/inputs/baseline/03_CSO_AAA09_Sheep_County_Region_2015_2025.xlsx
  sheep_breed_anchors: data/inputs/baseline/05A_DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.csv
  # Production allocation prior only: relative county weighting inside fixed AAA09 regions.
  dafm_sheep_county_pattern: data/inputs/baseline/03_0_DAFM_Sheep_County_Totals_2015_2020_2022_2025.csv
  goblin_cohorts: data/inputs/baseline/05C_Cattle_Cohort_Relationships_2012_2020.csv
  cso_land: data/inputs/baseline/06_CSO_AQA06_Agricultural_Land_Use.xlsx
  se_controls: data/inputs/baseline/06_Farm_Structure_Demographic_Controls.csv
  standard_output_mapping: data/inputs/baseline/08_IFS2020_Standard_Output_Mapping.xlsx
  standard_output_coefficients: data/controls/standard_output/IFS_SOC2020_IE_model_controls.csv
  # Reporting geometry only; it does not enter baseline reconstruction science.
  ed_boundaries_frozen: data/inputs/spatial/ED_Boundaries_Frozen.gpkg

outputs:
  cattle_panel: data/interim/cattle_ed_2015_2025.csv
  sheep_panel: data/interim/sheep_ed_2015_2025.csv
  cso_13_cohort_panel: data/interim/CSO_13_Cohort_Annual_Panel_2015_2025.csv
  goblin_31_cohort_panel: data/interim/GOBLIN_31_Cohort_Annual_Panel_2015_2025.csv
  enriched_master: data/processed/goblin_spatial_master_2015_2025.csv
  clean_workbook: data/processed/GOBLIN_Spatial_Final_Clean_Data_2015_2025.xlsx
  standard_output_master: data/processed/08_GOBLIN_Spatial_Standard_Output_2015_2025.csv
  ed_signatures: data/processed/09_GOBLIN_Spatial_ED_Cohort_Signatures_2020.csv
