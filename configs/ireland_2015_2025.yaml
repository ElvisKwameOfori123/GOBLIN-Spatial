study:
  name: Ireland ED baseline
  country: Ireland
  spatial_unit: Electoral Division
  start_year: 2015
  end_year: 2025
  base_year: 2020
  expected_eds: 2857

paths:
  raw: data/raw
  controls: data/controls
  interim: data/interim
  processed: data/processed

files:
  # CATTLE
  cso_ed_2020: data/raw/cattle/CSO_ED_2020.csv
  cso_cattle_county: data/raw/cattle/CSO_county_WIDE_2015_2025.csv.xz

  # SHEEP
  cso_sheep_county: data/raw/sheep/CSO_Sheep_County_WIDE_2015_2025.csv.xz
  cso_sheep_region: data/raw/sheep/CSO_Sheep_Region_WIDE_2015_2025.csv.xz
  cso_sheep_workbook: data/raw/sheep/CSO_Sheep_County_and_Region_WIDE_2015_2025.xlsx
  sheep_breed_anchors: data/raw/sheep/DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.zip

  # LAND
  cso_land: data/raw/land/AQA06_Unpivoted_2013_2025.csv

  # GOBLIN + SE CONTROLS
  goblin_cohorts: data/controls/cohort2012-2020.csv
  se_controls: data/controls/06_SE_Data_Controls.csv
  county_region_map: data/controls/county_region_map.csv

  # FROZEN GOBLIN PASTURE FEED CONTROL
  pasture_dm_controls: data/controls/pasture/GOBLIN_pasture_dm_2020_fixed.csv

  # ED AGRICULTURAL SOIL PROFILE
  # Source UAA weights the soil shares; ALL_GRASSLAND remains authoritative.
  agricultural_soil_profile: data/controls/soil/ED_GOBLIN_soil_profile.csv.xz
  agricultural_soil_source: data/external/soil/cathal.csv

  # LPIS / SPATIAL OPPORTUNITY CONTEXT
  # Large parcel GeoParquets remain external. The one-off overlay produces the
  # compact two-snapshot ED control used by normal opportunity runs.
  saps_ed_geography: data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.shp
  lpis_2020_parcels: data/external/spatial/lpis/LPIS_2020_GOBLIN_reduced.parquet
  lpis_2025_parcels: data/external/spatial/lpis/LPIS_2025_GOBLIN_reduced.parquet
  lpis_ed_profile: data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz

  # STANDARD OUTPUT
  standard_output_mapping: data/controls/standard_output/GOBLIN_SO_mapping.csv
  standard_output_coefficients: data/controls/standard_output/IFS_SOC2020_IE_model_controls.csv

outputs:
  cattle_panel: data/interim/cattle_ed_2015_2025.csv
  sheep_panel: data/interim/sheep_ed_2015_2025.csv
  livestock_master: data/interim/livestock_ed_2015_2025.csv
  cohort_master: data/interim/goblin_31_cohort_master_2015_2025.csv
  enriched_master: data/processed/goblin_spatial_master_2015_2025.csv
  clean_workbook: data/processed/GOBLIN_Spatial_Final_Clean_Data_2015_2025.xlsx
