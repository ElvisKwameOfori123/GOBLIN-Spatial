study:
  name: Ireland ED baseline
  country: Ireland
  spatial_unit: Electoral Division
  start_year: 2015
  end_year: 2025
  base_year: 2020
  expected_eds: 2857

paths:
  raw: data/raw
  controls: data/controls
  interim: data/interim
  processed: data/processed

files:
  # VALIDATED HISTORICAL BASELINE INPUTS: stages 01-09
  cso_ed_2020: data/inputs/baseline/01_CSO_ED_Agricultural_Baseline_2020.csv
  cso_cattle_county: data/inputs/baseline/01_CSO_AAA10_Cattle_County_2015_2025.csv
  cso_sheep_workbook: data/inputs/baseline/03_CSO_AAA09_Sheep_County_Region_2015_2025.xlsx
  sheep_breed_anchors: data/inputs/baseline/05A_DAFM_Sheep_Breed_Anchors_2016_2020_2022_2025.csv
  dafm_sheep_county_validation: data/inputs/baseline/03_0_DAFM_Sheep_County_Totals_2015_2020_2022_2025.csv
  goblin_cohorts: data/inputs/baseline/05C_Cattle_Cohort_Relationships_2012_2020.csv
  cso_land: data/inputs/baseline/06_CSO_AQA06_Agricultural_Land_Use.xlsx
  se_controls: data/inputs/baseline/06_Farm_Structure_Demographic_Controls.csv
  standard_output_mapping: data/inputs/baseline/08_IFS2020_Standard_Output_Mapping.xlsx
  standard_output_coefficients: data/controls/standard_output/IFS_SOC2020_IE_model_controls.csv

  # PRINCIPAL SCENARIO RUNTIME
  # One repository-contained neutral 2020 control supplies the final model-ED
  # 08B agricultural capability, independent 08C physical-soil evidence and
  # LPIS 2020 context. SC1 uses only 08B. SC2/SC3 use LPIS/08C only after SC1.
  land_context_2020: data/controls/land/ED_Land_Context_2020
  scenario_controls: data/controls/scenario/GOBLIN_Scenario_Controls.csv
  pasture_dm_controls: data/controls/pasture/GOBLIN_pasture_dm_2020_fixed.csv

  # OPTIONAL FIRST-PRINCIPLES RECONSTRUCTION / PROVENANCE SOURCES
  # Principal scenario execution never requires these files and never triggers
  # their download or geospatial rebuilding automatically.
  agricultural_soil_source: data/inputs/spatial/08B_NFS_Agricultural_Soil_Capability.csv
  agricultural_soil_profile: data/controls/soil/ED_GOBLIN_soil_profile.csv.xz
  physical_soil_package: data/inputs/spatial/08C_IFS_Mapped_Physical_Soil_Package.zip
  physical_soil_profile: data/controls/soil/ED_IFS_mapped_physical_soil_profile.csv.xz
  saps_ed_geography: data/external/spatial/ed/Electoral_Divisions_generalised_SAPS_Shp_with_proper_names.shp
  lpis_2020_parcels: data/external/spatial/lpis/LPIS_2020_GOBLIN_reduced_v2.parquet
  lpis_2025_parcels: data/external/spatial/lpis/LPIS_2025_GOBLIN_reduced.parquet
  lpis_ed_profile: data/controls/lpis/ED_LPIS_opportunity_2020_2025.csv.xz
  ed_boundaries_frozen: data/inputs/spatial/SC2_ED_Boundaries_Frozen.gpkg
  lpis_2020_frozen: data/inputs/spatial/SC2_LPIS_2020_Frozen.parquet
  lpis_2025_frozen: data/inputs/spatial/SC2_LPIS_2025_Frozen.parquet

outputs:
  cattle_panel: data/interim/cattle_ed_2015_2025.csv
  sheep_panel: data/interim/sheep_ed_2015_2025.csv
  livestock_master: data/interim/livestock_ed_2015_2025.csv
  cohort_master: data/interim/goblin_31_cohort_master_2015_2025.csv
  enriched_master: data/processed/goblin_spatial_master_2015_2025.csv
  clean_workbook: data/processed/GOBLIN_Spatial_Final_Clean_Data_2015_2025.xlsx
  standard_output_master: data/processed/08_GOBLIN_Spatial_Standard_Output_2015_2025.csv
  ed_signatures: data/processed/09_GOBLIN_Spatial_ED_Cohort_Signatures_2020.csv
